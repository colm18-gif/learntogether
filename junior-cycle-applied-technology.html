able requirements','A finished product','A workshop rule only','A type of material'],0],['A hazard is',['Something with potential to cause harm','The likelihood of harm only','A successful prototype','A design drawing'],0],['A sensor is used to',['Detect a change in surroundings','Cut material','Store a drawing','Provide a surface finish'],0],['An actuator is a component that',['Converts a signal into action','Measures temperature only','Stores a program','Makes a risk assessment'],0],['Sustainable design considers',['Environmental, social and economic effects','Appearance only','Cost only','The fastest manufacture only'],0]];const CBAQUIZ=[['CBA 1 focuses on',['Application of controlled systems in a local context','Only freehand sketching','Writing an exam essay','A final product only'],0],['A controlled system includes',['Inputs, processing and outputs','Only a battery','Only a sensor','Only a user'],0],['Self-analysis should use',['Specific evidence from your work','Only a general opinion','No criteria','Another student’s work'],0],['Evaluation should include',['Strengths, limitations and next steps','Praise only','A title only','No evidence'],0],['A digital presentation should',['Communicate researched findings clearly','Replace the investigation','Use images with no explanation','Avoid conclusions'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Applied Technology by designing, making, controlling and improving.</h2><p>This 26-unit pathway develops practical understanding of materials, manufacture, electronics, control systems, technical communication, sustainability and project work. It also provides structured support for both Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn key concepts, talk through the design habit, complete an active task and take the quiz. Save sketches, plans, test results, photographs, evaluations and reflections in a technology portfolio.<br><br><b>Safety first:</b> practical work must follow the teacher’s instructions, school safety rules, tool-specific procedures and risk assessments. This resource supports learning but does not replace supervised workshop instruction.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The applied technologist’s toolkit</div><div class="grid"><div class="card learning"><h4>Define and communicate</h4><p>Understand the user, brief, specification and constraints, then explain ideas with sketches, models and drawings.</p></div><div class="card learning"><h4>Make and control safely</h4><p>Select suitable materials, processes and systems while following robust safety procedures.</p></div><div class="card learning"><h4>Test and improve responsibly</h4><p>Use data and feedback to evaluate function, quality, usability and lifecycle impact.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a real product or system and identify user needs, constraints and design opportunities.','Create a labelled sketch, diagram, plan, test table or model using key vocabulary accurately.','Evaluate one decision for safety, performance, cost, users and environmental impact.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===2?[['A brief opens the problem','For example: design a safe, portable way to organise charging cables for a student workspace.'],['A specification tests the answer','For example: holds five cables, costs under €10, has no sharp edges and uses recycled material where possible.'],['Useful habit','Return to the specification when choosing ideas and evaluating the final outcome.']]:i===10?[['Manufacture follows a sequence','Plan marking out, cutting, shaping, joining, finishing and quality checks before starting.'],['Accuracy prevents waste','Measure, mark, check and only then cut or drill.'],['Useful habit','Photograph or record stages to provide evidence of process and decisions.']]:i===16?[['Controlled systems follow a pattern','Input → process → output, often with feedback to adjust the response.'],['Example: automatic lighting','A light sensor is input; controller processing compares light level; lamp is output.'],['Useful habit','Draw block diagrams before writing code or wiring components.']]:i===23?[['CBA 1 is investigative','It focuses on exploring the application of controlled systems in a local context.'],['Good evidence is specific','Use diagrams, photographs, observations, research and properly identified sources.'],['Evaluation goes beyond description','Judge how well the system meets needs and propose a feasible improvement.']]:i===24?[['CBA 2 is reflective','It involves student self-analysis and evaluation of learning and practical work.'],['Select evidence deliberately','Choose work that shows knowledge, skill development, feedback and improvement.'],['Make targets actionable','State exactly what you will practise, change or check next time.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===23||i===24)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on safe design, making, control and evaluation</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Design or make</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Technology habit:</b> define the need, plan safely, communicate clearly, make accurately, test against criteria and improve using evidence.</div><div class="box align"><h4 style="margin:0 0 8px">Applied Technology learning connection</h4><p style="margin:0">This unit develops design, communication, materials processing, energy and control, technology in context, safety, sustainability and reflection through practical activity.</p><div class="tags"><span class="tag">Design and communication</span><span class="tag">Making and control</span><span class="tag">Safety and sustainability</span></div><ul><li>Investigate a technological need or application and use appropriate evidence.</li><li>Communicate and develop ideas using drawings, models, data or digital tools.</li><li>Evaluate performance, quality, safety, user experience and environmental impact.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save research, sketches, a specification, a risk assessment, cutting list, circuit diagram, test result, photograph, evaluation or reflection. Add: “The design and making skill I can use more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Draw or describe one system, mechanism or process.</li><li>Identify one safety control and why it matters.</li><li>Suggest one evidence-based improvement.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();</script></body></html>
