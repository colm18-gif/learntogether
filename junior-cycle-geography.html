#416b550f}.opt.correct{border-color:var(--good);background:#3e7a4f19}.opt.incorrect{border-color:var(--bad);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--deep);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.score{font:12px monospace;color:var(--deep)}.done{margin-top:28px;padding:15px 17px;border:1px dashed var(--ochre);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--soft)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.sidefoot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Geography, Connected</h1><p>A shared Junior Cycle Geography path</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="sidefoot">26 units across the physical world, human interaction with the physical world, and people, place and change—viewed through systems, skills and sustainability.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="progress"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>

['Earth Structure and Plate Tectonics','Exploring the Physical World','Explain the structure of the Earth and use plate tectonics to account for volcanoes, earthquakes and fold mountains.','Crust|The thin outer layer of the Earth.','Mantle|The thick layer of hot, slowly moving rock below the crust.','Core|The central part of the Earth, mainly iron and nickel.','Plate tectonics|Theory that Earth’s lithosphere is broken into moving plates.','Convergent boundary|Boundary where plates move together.','Divergent boundary|Boundary where plates move apart.'],
['Rocks, Weathering and Soils','Exploring the Physical World','Classify rocks, explain weathering and mass movement, and investigate how soils form and support life.','Igneous rock|Rock formed when molten material cools.','Sedimentary rock|Rock formed from compacted layers of sediment.','Metamorphic rock|Rock changed by heat and pressure.','Weathering|Breakdown of rock in place.','Mass movement|Downslope movement of rock or soil under gravity.','Soil profile|Vertical layers within a soil.'],
['Rivers and Fluvial Landscapes','Exploring the Physical World','Explain erosion, transport and deposition in rivers and identify the landforms they create.','Erosion|Wearing away and removal of material.','Transportation|Movement of eroded material.','Deposition|Dropping of material when energy decreases.','Meander|Bend in a river channel.','Floodplain|Flat land beside a river built by deposition.','Drainage basin|Area drained by a river and its tributaries.'],

['Climate and Weather','Exploring the Physical World','Classify global climates, explain controls on Ireland’s climate and gather, record and interpret weather data.','Climate|Long-term average weather pattern.','Weather|Day-to-day atmospheric conditions.','Air mass|Large body of air with similar temperature and moisture.','Relief rainfall|Rainfall caused when air rises over high land.','Latitude|Distance north or south of the Equator.','Prevailing wind|Most frequent wind direction.'],
['Extreme Weather and Natural Hazards','Exploring the Physical World','Investigate the formation, impacts and management of a significant weather event or natural hazard.','Hazard|Natural event with potential to cause harm.','Vulnerability|Degree to which people or places can be harmed.','Mitigation|Action reducing the impact of a hazard.','Adaptation|Adjustment to live with expected change or risk.','Forecast|Prediction based on data and models.','Resilience|Ability to prepare for, withstand and recover from hazards.'],

['Globalisation and Interdependence','People, Place and Change','Analyse connections between places through trade, culture, migration, technology and global production networks.','Globalisation|Growing connections between places worldwide.','Interdependence|Mutual reliance between places or systems.','Multinational company|Company operating in more than one country.','Outsourcing|Using another organisation or country for work or production.','Global supply chain|International network producing and delivering goods.','Cultural diffusion|Spread of ideas or cultural practices.'],

const GENERAL=[['Ask geographical questions','Who? What? Where? When? Why? How? What are the consequences, and at what scale?'],['Use evidence spatially','Support claims with maps, images, data, fieldwork observations and named locations.'],['Think sustainably','Consider environmental, social and economic consequences, including who gains, who loses and future impacts.']];const SPECIAL={8:['Use a map to find a location with four- and six-figure grid references.','Measure a route using map scale and convert to real distance.','Explain how contour spacing shows steepness and plan a safe fieldwork route.'],21:['Write a hypothesis and choose a suitable primary-data method.','Collect data ethically, present it in a graph, map or table, and identify a pattern.','Evaluate reliability, sampling, safety and one improvement for the investigation.'],22:['Choose a current news story with a clear geographical dimension.','Compare at least two credible sources and locate the event on a map.','Explain implications using processes, patterns, systems, scale, skills and sustainability.'],23:['Choose a local geographical question and plan safe fieldwork.','Gather observations and data, then present and analyse a clear pattern.','Evaluate the inquiry and make one evidence-based recommendation.'],24:['Compare options for a real issue using environmental, social and economic criteria.','Create a map, decision matrix or evidence table.','Make a recommendation that acknowledges trade-offs and alternative perspectives.']};const QUIZ=[['A geographical pattern describes',['How something is arranged across space','A single opinion','A grammar rule','A financial account'],0],['Scale in geography can mean',['Local, regional, national or global level','Only map size','A weather instrument','A type of rock'],0],['Sustainability means',['Meeting present needs without damaging future capacity','Stopping all development','Using all resources immediately','Avoiding evidence'],0],['A strong geographical explanation should use',['Named places, evidence and processes','Only a personal opinion','No maps or data','A list of definitions'],0],['Interdependence means',['Places or systems rely on one another','Places are identical','No global connections exist','Only physical processes matter'],0]];const CBAQUIZ=[['A geographical inquiry begins with',['A focused geographical question','A final conclusion','A random graph','A title only'],0],['Primary data is',['Collected first-hand','Always from a textbook','Never useful','Only historic information'],0],['A credible news investigation should',['Compare reliable sources','Use one social-media post only','Ignore maps','Avoid evidence'],0],['Evaluation should include',['Strengths, limitations and improvements','Only praise','No reflection','A copied conclusion'],0],['A recommendation should be',['Supported by geographical evidence','A random preference','Unrelated to findings','Left unexplained'],0]];
let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Geography through people, places, environments and connections.</h2><p>This 26-unit pathway covers the physical world, human interaction with the physical world, and people, place and change. Every unit uses the lenses of processes, patterns, systems and scale; geographical skills; and sustainability.</p><div class="note"><b>How to use this:</b> learn the concepts, discuss the worked habits, complete the active task and take the quiz. Save maps, fieldwork notes, diagrams, data displays and reflections in a Geography portfolio.<br><br><b>Flexible by design:</b> schools select and sequence learning outcomes differently. Use this pathway to match classroom learning and local fieldwork opportunities.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The geographer’s toolkit</div><div class="grid"><div class="card learning"><h4>Think spatially</h4><p>Locate, map and compare patterns at local, regional, national and global scales.</p></div><div class="card learning"><h4>Investigate evidence</h4><p>Use fieldwork, maps, images, graphs and reliable secondary data to answer questions.</p></div><div class="card learning"><h4>Make sustainable decisions</h4><p>Consider environmental, social and economic impacts, trade-offs and different stakeholders.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a relevant location and identify the key processes, patterns and people involved.','Use a map, image, graph, fieldwork observation or data source to support an explanation.','Compare two stakeholder perspectives and make a sustainable, evidence-based judgement.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===0?[['Tectonic plates move slowly','Movement at boundaries can produce earthquakes, volcanoes and mountain building.'],['Hazard is not disaster by itself','Impact depends on exposure, vulnerability, preparation and response.'],['Useful habit','Use a labelled cross-section and map to explain a physical process.']]:i===5?[['Weather is short-term','Climate describes long-term average conditions over decades.'],['Ireland’s climate has several controls','Latitude, Atlantic influence, prevailing winds, ocean currents, relief and distance from the sea all matter.'],['Useful habit','Record weather using correct units, then look for patterns over time.']]:i===13?[['Climate change is uneven','Causes, exposure, resources and capacity to respond differ greatly between places.'],['Mitigation and adaptation differ','Mitigation addresses causes; adaptation reduces harm from impacts.'],['Useful habit','Name the scale and stakeholder when explaining climate action.']]:i===22?[['Geography in the News is current and spatial','A strong response connects a real event with place, process and consequence.'],['Check media sources','Compare source, date, evidence, framing and missing perspectives.'],['Explain implications','Move beyond “what happened” to “why here, who is affected and what may happen next”.']]:i===23?[['My Geography is local inquiry','It applies geographical thinking to a chosen aspect of the local area.'],['Method matters','Choose safe, ethical methods that can answer the question.'],['Evaluation strengthens conclusions','Discuss reliability, limitations, unexpected results and improvements.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===22||i===23)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on processes, patterns, systems, scale, skills and sustainability</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Investigate</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Geographical habit:</b> ask where and why there, use evidence at the right scale, identify connections and make a judgement that considers environmental, social and economic consequences.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle learning connection</h4><p style="margin:0">This unit is explored through the contextual elements of processes, patterns, systems and scale; geographical skills; and sustainability.</p><div class="tags"><span class="tag">Processes and scale</span><span class="tag">Geographical skills</span><span class="tag">Sustainability</span></div><ul><li>Use maps, data, imagery and observations to investigate a geographical question.</li><li>Explain connections between people, places, environments and spatial patterns.</li><li>Make an informed judgement that recognises different perspectives and future impacts.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a labelled diagram, map, data display, fieldwork note, news analysis, inquiry page or reflection. Add: “The geographical connection I can explain now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Locate one relevant place or example.</li><li>Explain one process and one consequence.</li><li>Make a sustainable judgement using evidence.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();(function(){var m=location.hash.match(/^#u(\d+)$/);if(m&&RAW[+m[1]])go(+m[1]);else home()})();</script></body></html>
