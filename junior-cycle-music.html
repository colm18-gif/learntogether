dy, rhythm, harmony, texture, form and technology.'],24:['Choose a piece or performance and identify its audience and context.','Research using credible sources, then integrate precise listening details.','Draft a programme note that informs rather than merely lists facts, and cite sources carefully.'],25:['Set a realistic performance target and break practice into short focused stages.','Record, listen back and use a checklist for rhythm, pitch, technique, expression and balance.','Write one strength, one challenge and one exact next rehearsal action.']};const QUIZ=[['A motif is',['A short recognisable musical idea','A type of instrument only','A full orchestra','A silent bar'],0],['Timbre describes',['Tone colour or sound quality','Tempo only','The number of bars','A song title'],0],['A crescendo is',['A gradual increase in volume','A sudden stop','A repeated chord','A change of key'],0],['Active listening means',['Focused listening with a purpose','Listening while doing something else','Only hearing lyrics','Avoiding musical vocabulary'],0],['A good musical evaluation includes',['Specific evidence and a next step','Only “it was good”','No listening back','A title only'],0]];const CBAQUIZ=[['CBA 1 in Junior Cycle Music is',['A Composition Portfolio','A final concert only','A music theory exam only','A programme note'],0],['CBA 2 is',['A Programme Note','A composition portfolio','A scale test only','A dance performance'],0],['A composition portfolio should show',['Original ideas, development and revision','Only one unedited first draft','No recordings or notation','Other people’s music presented as your own'],0],['A programme note should include',['Context and specific musical listening evidence','Only an emoji review','No research','A list of unrelated songs'],0],['A composer statement explains',['Creative choices and process','Only the title','Nothing about revision','Another person’s opinions'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Music by listening, performing, creating and connecting.</h2><p>This 26-unit pathway develops the three connected strands of Procedural Knowledge, Innovate and Ideate, and Culture and Context. It builds practical skills in performance, listening, notation, composition, music technology and musical understanding, with support for both Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn key concepts, listen actively, complete a short musical task and take the quiz. Save recordings, scores, lyric drafts, listening notes, composition sketches, programme notes and reflections in a Music portfolio.<br><br><b>Make music safely and respectfully:</b> follow teacher guidance for instruments, equipment, hearing protection, recording permissions and use of copyrighted material. This pathway supports classroom music-making; it does not replace supervised practical instruction.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The musician’s toolkit</div><div class="grid"><div class="card learning"><h4>Hear with intention</h4><p>Listen for musical elements, patterns, contrasts, context and the choices that shape audience response.</p></div><div class="card learning"><h4>Make and improve</h4><p>Perform, compose, improvise, record, listen back, respond to feedback and revise with purpose.</p></div><div class="card learning"><h4>Connect music and culture</h4><p>Respect music’s communities, histories, identities and changing role in everyday life and media.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a suitable musical example and identify the elements, context and purpose you can hear.','Create a short performance, listening response, notation example or composition idea using the unit vocabulary.','Evaluate one musical choice with precise listening evidence and suggest an improvement.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===2?[['Rhythm creates movement and shape','A rhythm uses sound and silence; it can repeat, vary, syncopate or change to create contrast.'],['Tempo is speed, not rhythm','The same rhythm can be performed at different tempos.'],['Useful habit','Count aloud, tap the pulse and practise slowly before increasing speed.']]:i===4?[['Harmony supports melody','Chords can create stability, tension, movement and a sense of arrival.'],['Tonic feels like home','The tonic chord or note often creates a feeling of rest or resolution.'],['Useful habit','Listen for when harmony changes and how that affects mood or structure.']]:i===17?[['Irish traditional music is a living tradition','It includes many regional and personal styles, instruments, settings and contemporary developments.'],['Listen for detail','Tune type, pulse, ornamentation, instrumentation and context can all inform a response.'],['Useful habit','Describe what you hear precisely and respectfully rather than treating one style as representative of all Irish music.']]:i===23?[['CBA 1 is the Composition Portfolio','Students create and present original musical work with supporting evidence of development and reflection.'],['Revision matters','Drafts, recordings, notation and feedback can show how ideas became more effective.'],['Originality and attribution matter','Develop your own material and acknowledge any stimulus, source or borrowed material appropriately.']]:i===24?[['CBA 2 is the Programme Note','Students communicate knowledge and understanding of a selected musical work or performance for an audience.'],['Listening must be specific','Support points with details such as instrumentation, rhythm, melody, harmony, structure, dynamics or context.'],['Research should be credible','Use reliable sources and record them accurately in your own words.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===23||i===24)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on hearing, making, understanding and communicating music</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Listen or explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Perform or create</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Musical habit:</b> identify a precise musical detail, use accurate vocabulary, explain its effect, then listen, perform or create again with one purposeful improvement.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle Music connection</h4><p style="margin:0">This unit integrates Procedural Knowledge, Innovate and Ideate, and Culture and Context through practical music-making, listening, creation, reflection and communication.</p><div class="tags"><span class="tag">Procedural knowledge</span><span class="tag">Innovate and ideate</span><span class="tag">Culture and context</span></div><ul><li>Perform, listen to, read or create music using suitable technical and expressive skills.</li><li>Develop ideas through exploration, feedback, recording, notation or digital technology.</li><li>Explain music in its cultural, historical, social, performance or media context.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a recording, rehearsal note, listening response, notation extract, motif, lyric draft, arrangement, technology screenshot, composition draft, programme-note paragraph or reflection. Add: “The musical choice I can make more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Identify one example in a piece you know.</li><li>Describe one musical effect precisely.</li><li>Perform, create or explain one improvement.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();</script></body></html>
