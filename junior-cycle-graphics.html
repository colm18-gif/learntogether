<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphics, Visual Thinking — Junior Cycle</title><style>:root{--paper:#f2ecdd;--card:#fbf8f1;--ink:#2b2418;--soft:#6b6152;--accent:#70488b;--deep:#3a1c50;--light:#d5b9e1;--gold:#d9a441;--clay:#b5592d;--line:#dcd2b8;--good:#3e7a4f;--bad:#b8412e;--r:14px}*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font:15px/1.55 Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(circle at 1px 1px,rgba(112,72,139,.08) 1px,transparent 1.6px);background-size:22px 22px}.app{display:flex;min-height:100vh;position:relative}.sidebar{width:290px;background:var(--deep);color:#efe6d4;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;padding:27px 0 18px}.brand{padding:0 24px 20px;border-bottom:1px solid #ffffff28}.brand h1,h2,h3,h4{font-family:Georgia,serif;line-height:1.2}.brand h1{margin:0;color:#f4eedf;font-size:1.42rem}.brand p{margin:6px 0 0;color:var(--light);font-size:.78rem}.back{display:block;color:var(--light);padding:14px 24px 0;font-size:.76rem}.nav{list-style:none;margin:0;padding:10px 12px}.nav li{margin:2px 0}.nav button{width:100%;border:0;background:none;color:#efe6d4dc;text-align:left;padding:8px 11px;border-radius:9px;cursor:pointer;font:inherit;font-size:.84rem;display:flex;gap:9px;align-items:center}.nav button:hover{background:#ffffff12;color:#fff}.nav button.active{background:var(--gold);color:var(--deep);font-weight:bold}.num{font:11px monospace;width:22px;height:22px;display:grid;place-items:center;background:#ffffff1b;border-radius:5px;flex-shrink:0}.active .num{background:var(--deep);color:var(--gold)}.dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--gold)}.active .dot{background:var(--deep)}.sidefoot{padding:14px 24px;border-top:1px solid #ffffff28;color:var(--light);font-size:.72rem}.main{min-width:0;flex:1;padding:38px 56px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:28px}.crumb{font:600 1.1rem Georgia,serif;color:var(--deep)}.progress{display:flex;align-items:center;gap:13px}.mosaic{display:grid;grid-template-columns:repeat(5,14px);gap:3px}.cell{height:14px;border:1px solid var(--line);border-radius:3px;background:#e3d9bc}.cell.on{background:linear-gradient(135deg,var(--accent) 0 45%,var(--gold) 50%);border-color:var(--deep)}.count{font:12px monospace;color:var(--soft)}.count b{color:var(--deep)}.hero{background:var(--deep);border-radius:20px;padding:40px;color:#efe6d4;margin-bottom:34px}.eyebrow{font:12px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}.hero h2{margin:0;color:#f8f2e4;font-size:1.95rem;max-width:760px}.hero p{max-width:760px;color:#d8ccb3;margin:14px 0 0}.note{margin-top:21px;max-width:730px;padding:15px 17px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff0d;font-size:.9rem}.note b{color:var(--gold)}.title{display:flex;align-items:center;gap:10px;font:1.17rem Georgia,serif;color:var(--deep);margin:32px 0 14px}.title:after{content:"";height:1px;flex:1;background:var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.start{cursor:pointer}.start:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2b241814}.start .u{font:12px monospace;color:var(--clay)}.start h3{font-size:1rem;margin:4px 0}.strand{font-size:.82rem;color:var(--accent);font-style:italic}.unit-head{margin-bottom:25px}.unit-head h2{font-size:1.9rem;margin:5px 0}.intro{max-width:780px;color:var(--soft)}.flip{height:128px;perspective:900px;cursor:pointer}.flipin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}.flip.flipped .flipin{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:13px;border-radius:var(--r);backface-visibility:hidden}.front{background:var(--card);border:1px solid var(--line)}.front strong{font:600 1rem Georgia,serif;color:var(--deep)}.front small{display:block;color:var(--soft);margin-top:6px}.backface{background:var(--accent);color:#fff;transform:rotateY(180deg);font-size:.86rem}.fact{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px}.fact b{min-width:275px;color:var(--deep)}.fact span{flex:1;color:var(--soft)}.learning h4{margin:0 0 7px;color:var(--deep);font-size:1rem}.learning p{margin:0;color:var(--soft);font-size:.9rem}.box{padding:16px 18px;border-radius:var(--r);margin:10px 0 18px}.study{background:#70488b0d;border-left:4px solid var(--accent)}.align{background:#d9a4411a;border:1px solid var(--gold)}.portfolio{background:#fff;border:1px solid var(--accent)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.tag{background:var(--deep);color:#f4eedf;border-radius:999px;padding:5px 9px;font:11px monospace}.tag:nth-child(2){background:var(--accent)}.tag:nth-child(3){background:var(--clay)}.check{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.check li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.86rem}.check li:before{content:'✓';color:var(--good);font-weight:bold;margin-right:7px}.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}.q{margin-bottom:21px}.prompt{font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.opt.selected{border-color:var(--accent);background:#70488b0f}.opt.correct{border-color:var(--good);background:#3e7a4f19}.opt.incorrect{border-color:var(--bad);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--deep);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.score{font:12px monospace;color:var(--deep)}.done{margin-top:28px;padding:15px 17px;border:1px solid var(--gold);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--soft)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.sidefoot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Graphics, Visual Thinking</h1><p>A shared Junior Cycle Graphics path</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="sidefoot">26 units across 2D Graphics, 3D Graphics and Applied Graphics, with visual communication, design thinking and CBA support.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="progress"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>
const KEY='jc-graphics-visual-thinking-v1';const RAW=[['Seeing and Communicating Visually','Applied Graphics','Explore how graphical communication helps people think, design, explain, solve problems and share ideas accurately.','Graphics|Visual communication of information and ideas.','Visualisation|Forming a mental image of an object or space.','Graphic communication|Use of drawings, diagrams and symbols to convey meaning.','Scale|Relationship between drawing size and real size.','Accuracy|Closeness of a drawing or measurement to the intended value.','Convention|Agreed rule or symbol used in graphical work.'],['Sketching for Ideas','Applied Graphics','Develop freehand sketching as a fast way to observe, generate, test and communicate design ideas.','Sketch|Quick freehand drawing used to explore an idea.','Thumbnail|Small rough sketch showing an initial concept.','Annotation|Written note explaining a drawing or choice.','Proportion|Relationship of sizes within an object.','Observation|Careful looking to identify form and detail.','Iterate|Improve an idea through repeated testing and revision.'],['Line, Tone and Texture','2D Graphics','Use line quality, tone, shading and texture to communicate form, material, depth, light and emphasis.','Line weight|Thickness or darkness of a line.','Tone|Lightness or darkness of an area.','Shading|Use of tone to suggest light and form.','Texture|Visual or tactile surface quality.','Hatching|Parallel lines used to create tone.','Contrast|Difference between elements that creates emphasis.'],['Lettering and Layout','2D Graphics','Apply clear lettering, hierarchy, alignment and spacing to make technical and presentation drawings readable.','Lettering|Drawn or written characters used in a graphic.','Hierarchy|Visual order showing what should be noticed first.','Alignment|Lining elements up along a shared edge or axis.','White space|Unmarked area improving clarity and balance.','Title block|Area recording key drawing information.','Legibility|Ease with which writing or information can be read.'],['Measurement, Scale and Dimensioning','2D Graphics','Measure accurately and communicate size through appropriate scale, dimension lines, extension lines and notation.','Dimension|Numerical statement of size.','Scale drawing|Drawing enlarged or reduced by a fixed ratio.','Dimension line|Line showing the distance being measured.','Extension line|Thin line extending from an object to a dimension line.','Tolerance|Permitted variation from a stated measurement.','Ratio|Comparison of two quantities.'],['Geometric Construction','2D Graphics','Use instruments and accurate construction methods to create angles, triangles, polygons, circles, tangents and loci.','Construction|Accurate geometric drawing made using instruments.','Bisect|Divide an angle or line into two equal parts.','Locus|Path traced by a point following a condition.','Tangent|Line or curve touching a circle at one point.','Polygon|Closed shape with straight sides.','Arc|Part of a circle’s circumference.'],['Orthographic Projection','2D Graphics','Represent three-dimensional objects through related two-dimensional views, using projection conventions and alignment.','Orthographic projection|2D views representing a 3D object.','Elevation|View of an object from a side or front.','Plan|View of an object from above.','End elevation|Side view of an object.','Projector|Construction line transferring features between views.','Hidden detail|Feature not visible in a view, shown by a convention.'],['Plans, Elevations and Sections','2D Graphics','Read and produce drawings that communicate spaces and objects through plan, elevation and sectional views.','Section|View showing an object cut through.','Cutting plane|Imaginary plane indicating where a section is taken.','Hatching|Pattern indicating cut material in a section.','Floor plan|Plan view of a building or room.','Elevation drawing|Vertical view of a building or object.','Sectional elevation|Elevation showing internal details after a cut.'],['Developments and Surface Area','2D Graphics','Unfold three-dimensional forms into flat patterns and use developments to understand manufacture, packaging and surface area.','Development|Flat pattern that folds into a 3D surface.','Net|Development of a solid.','Lateral surface|Surface excluding the ends or bases.','Prism|Solid with two matching parallel polygon faces.','Cylinder|Solid with circular ends and curved surface.','Seam allowance|Extra material added for joining or fastening.'],['Isometric Drawing','3D Graphics','Represent three-dimensional objects in an isometric view using the three principal axes and accurate proportions.','Isometric drawing|3D representation using three equally spaced axes.','Isometric axis|One of three drawing directions, 120 degrees apart.','True length|Actual length of an edge.','Isometric scale|Scale accounting for foreshortening in some isometric systems.','Elliptical shape|Oval-like representation of a circle in isometric view.','Oblique view|3D drawing with a front face shown true shape.'],['Oblique and Pictorial Drawing','3D Graphics','Use pictorial drawing methods to communicate the appearance, proportion and spatial form of objects quickly.','Pictorial drawing|Drawing showing an object in three dimensions.','Oblique projection|Front face shown true shape with receding lines angled.','Cabinet oblique|Oblique method using reduced receding lengths.','Cavalier oblique|Oblique method using full receding lengths.','Foreshortening|Visual shortening of a receding dimension.','Receding line|Line moving away from the viewer in a pictorial drawing.'],['One-Point Perspective','3D Graphics','Construct perspective drawings using a horizon line and vanishing point to represent depth realistically.','Perspective|System for showing apparent depth on a flat surface.','Horizon line|Eye-level line in a perspective drawing.','Vanishing point|Point where parallel receding lines appear to meet.','Picture plane|Imaginary flat surface on which a view is drawn.','Eye level|Height of the viewer’s eyes.','Depth|Visual distance from front to back.'],['Two-Point Perspective','3D Graphics','Use two vanishing points to visualise corners, buildings and objects seen from an angle.','Two-point perspective|Perspective using two vanishing points.','Vertical edge|Edge remaining vertical in standard two-point perspective.','Station point|Position of the viewer in a perspective setup.','Convergence|Appearance of lines meeting at a vanishing point.','Field of view|Extent of a scene visible from a viewpoint.','Perspective grid|Guide system used to place objects in perspective.'],['Solids, Intersections and Penetration','3D Graphics','Visualise how geometric solids meet, intersect or penetrate and communicate the resulting shapes accurately.','Solid|Three-dimensional geometric form.','Intersection|Line or shape where surfaces meet.','Penetration|One solid passing through another.','Generator|Straight line generating the surface of a cylinder or cone.','Cone|Solid tapering from circular base to a point.','Sphere|Perfectly round 3D form.'],['Spatial Reasoning and Visualisation','3D Graphics','Develop the capacity to mentally rotate, deconstruct, assemble and predict views of objects and spaces.','Spatial reasoning|Ability to understand objects in space.','Mental rotation|Imagining an object turned in space.','Orientation|Position or direction of an object.','Transformation|Change of position, size or form.','Symmetry|Balanced correspondence across an axis or centre.','Visual cue|Feature helping the eye interpret depth or form.'],['CAD and Digital Modelling','Applied Graphics','Use appropriate digital tools to create, edit, view and communicate two- and three-dimensional graphical information.','CAD|Computer-aided design.','Model|Digital or physical representation of an object or system.','Layer|Separate editable level in a digital drawing.','Viewport|Area showing a view of a digital model.','Rendering|Creating an image from a digital model.','File format|Way digital information is structured and stored.'],['Design Process and Briefs','Applied Graphics','Respond to graphical problems through research, analysis, ideas, development, testing, communication and evaluation.','Design brief|Statement of a design problem or opportunity.','Specification|Detailed requirements a solution must meet.','User|Person for whom a design is intended.','Constraint|Limit affecting possible solutions.','Criteria|Standards used to judge success.','Prototype|Early model used to test an idea.'],['Materials, Processes and Manufacture','Applied Graphics','Investigate how materials, tools, processes and production methods influence designed products and graphical decisions.','Material|Substance used to make an object.','Manufacturing process|Method of turning materials into products.','Batch production|Making a set number of identical items.','Mass production|Large-scale manufacture of standardised items.','Joining method|Way components are connected.','Finish|Surface treatment affecting appearance or performance.'],['Human Factors and Universal Design','Applied Graphics','Consider users, ergonomics, accessibility, safety and inclusivity when communicating and developing design solutions.','Ergonomics|Design for people’s comfort, efficiency and safety.','Accessibility|Ease with which people can use a product or place.','Universal design|Design intended to be usable by the widest range of people.','Anthropometrics|Measurements of the human body used in design.','User-centred design|Design process focused on user needs.','Usability|Ease and effectiveness of use.'],['Sustainability and the Built World','Applied Graphics','Evaluate designs and technologies through lifecycle thinking, resource use, repairability, environmental impact and responsible innovation.','Lifecycle|Stages from sourcing through use and disposal.','Embodied energy|Energy used to make and transport a material or product.','Repairability|Ease with which an item can be fixed.','Circular economy|Keeping materials in use for as long as possible.','Resource efficiency|Achieving more with fewer resources.','Sustainable design|Design considering long-term environmental and social effects.'],['Graphic Presentation and Visual Impact','Applied Graphics','Create clear, purposeful graphical presentations using layout, colour, imagery, annotation and appropriate media.','Presentation drawing|Drawing designed to explain or persuade an audience.','Visual impact|Strength and clarity of an initial visual impression.','Colour scheme|Planned group of colours.','Annotation|Note adding explanation to a graphic.','Infographic|Visual presentation of information or data.','Audience|People for whom a graphic is intended.'],['Research and Analysis','Applied Graphics','Gather, evaluate and communicate relevant information to inform a graphical response to a problem or opportunity.','Research|Systematic gathering of information.','Primary research|Information gathered directly, such as observation or survey.','Secondary research|Information taken from existing sources.','Analysis|Careful examination to identify meaning or needs.','Source|Origin of information or evidence.','Bias|Tendency that can affect fairness or accuracy.'],['Communicating Through Sketching: CBA 1','CBA 1 Planner','Investigate and communicate ideas through freehand sketching, observation, visual thinking, annotation and purposeful development.','Communicating through sketching|CBA focused on visual investigation and freehand communication.','Visual inquiry|Exploring a subject through looking, drawing and questioning.','Sketchbook evidence|Collected sketches, notes, ideas and development.','Annotation|Brief writing that explains observations and choices.','Idea development|Process of refining concepts through drawing.','Reflection|Thoughtful evaluation of learning and next steps.'],['Graphical Presentation Skills: CBA 2','CBA 2 Planner','Research, develop and present graphical information in response to a brief using suitable drawing, modelling and communication skills.','Graphical presentation skills|CBA focused on research, development and presentation of a graphical response.','Brief response|Solution that addresses stated requirements.','Presentation medium|Method used to communicate, such as drawing, model or digital work.','Design rationale|Explanation of why choices were made.','Technical accuracy|Correct use of graphical conventions and methods.','Evaluation|Judgement of outcome against criteria.'],['Problem Solving and Project Preparation','Integrated Practice','Apply graphical knowledge and visual thinking to analyse a problem, generate alternatives, select a solution and communicate it clearly.','Problem solving|Finding and applying a solution to a challenge.','Alternative solution|Different possible response to a problem.','Feasibility|Whether an idea can realistically be achieved.','Iteration|Cycle of testing and improving.','Decision matrix|Tool for comparing options against criteria.','Justification|Evidence-based explanation of a decision.'],['Review: Visual Thinking in Action','Integrated Review','Connect sketching, 2D drawing, 3D visualisation, applied design, digital tools, communication and responsible innovation.','Visual literacy|Ability to interpret and create visual meaning.','Graphical convention|Agreed method for representing information.','Design thinking|Iterative approach to understanding and solving problems.','Spatial awareness|Understanding of position, scale and relationship in space.','Informed choice|Decision made using relevant evidence.','Reflection|Evaluation of learning and an identified next step.']];const GENERAL=[['Think before drawing','Identify purpose, audience, scale, views, conventions, accuracy requirements and available tools.'],['Use construction with intention','Light construction lines, deliberate line weight, correct instruments and clear labels make thinking visible.'],['Evaluate against the brief','Check clarity, technical accuracy, user needs, visual impact, sustainability and the next practical improvement.']];const SPECIAL={1:['Choose an everyday object and make five 60-second thumbnail sketches from observation.','Select one sketch and add annotations about shape, function, size, materials and user needs.','Redraw it after feedback, making one visible improvement to proportion or clarity.'],5:['Construct a perpendicular bisector and angle bisector using suitable instruments.','Use construction methods to create a polygon, tangent or locus under teacher guidance.','Explain which construction lines are necessary evidence and which should remain light.'],6:['Draw a simple object in plan, front elevation and end elevation.','Use projectors and alignment to transfer features consistently between views.','Compare the views with a physical object or model and correct one mismatch.'],8:['Create a net for a prism or cylinder and label joining areas.','Calculate or compare surface areas using a teacher-approved method.','Explain how packaging design can reduce waste while protecting a product.'],11:['Set a horizon line and vanishing point, then draw a simple interior or road scene.','Add receding parallel edges that converge consistently.','Explain how eye level changes the viewer’s experience of the scene.'],15:['Create a simple 2D or 3D model using teacher-approved CAD software.','Use layers, views or basic editing tools to improve clarity.','Export or present the work with a meaningful title, scale or annotation.'],16:['Turn an everyday need into a concise design brief with user, purpose and constraints.','Generate at least three annotated ideas and compare them against criteria.','Choose one direction and justify it using evidence rather than preference alone.'],18:['Identify three user needs that could affect a product, space or sign.','Modify a design feature to improve accessibility, comfort or safety.','Explain how universal design can benefit many users, not only one group.'],22:['Investigate a chosen object, place or topic through observation sketches and annotations.','Develop a page of sketches showing varied viewpoints, detail, proportion and visual ideas.','Reflect on what the drawings communicate and identify a specific next sketching goal.'],23:['Analyse a graphical brief for user, audience, purpose, constraints and success criteria.','Research and develop a presentation using suitable drawing or digital methods.','Evaluate the result against technical accuracy, communication, visual impact and the brief.']};const QUIZ=[['Orthographic projection uses',['Related 2D views to represent a 3D object','Only a photograph','A musical score','A map without scale'],0],['A plan is usually a view from',['Above','Below','The front only','Inside a material'],0],['A vanishing point is used in',['Perspective drawing','Dimensioning only','A colour wheel','A title block'],0],['A development is',['A flat pattern that folds into a 3D surface','A completed perspective view','A type of line weight','A font style'],0],['A good design brief identifies',['A problem, user or purpose and constraints','Only a preferred colour','The final answer already','No need for research'],0]];const CBAQUIZ=[['CBA 1 in Junior Cycle Graphics is',['Communicating through sketching','A written music note','A final examination','A woodwork project only'],0],['CBA 2 focuses on',['Graphical presentation skills','Only freehand lettering','A performance recital','A food brief'],0],['Annotations should',['Explain observations, choices or development','Replace all drawings','Be unrelated to the work','Hide the design process'],0],['Technical accuracy includes',['Correct methods, conventions and clear communication','Decorative colour only','Avoiding measurement','Ignoring the brief'],0],['Evaluation should compare work with',['Clear success criteria and the brief','Random opinions only','A blank page','No evidence'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Graphics through visual thinking, accurate drawing and purposeful design.</h2><p>This 26-unit pathway develops the connected strands of 2D Graphics, 3D Graphics and Applied Graphics. It supports sketching, technical drawing, spatial visualisation, digital modelling, design communication and the two Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn the vocabulary, study the method, complete a short drawing or design task and take the quiz. Save sketches, constructions, orthographic views, developments, CAD files, research, annotations and evaluations in a Graphics portfolio.<br><br><b>Work safely and accurately:</b> follow teacher guidance for drawing equipment, cutting tools, computers, software, file handling and workshop or classroom procedures. This pathway supports learning but does not replace supervised practical instruction.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The visual thinker’s toolkit</div><div class="grid"><div class="card learning"><h4>See the problem</h4><p>Observe closely, identify purpose and users, gather evidence and ask what must be communicated.</p></div><div class="card learning"><h4>Make thinking visible</h4><p>Use sketches, projections, models, notation, scale and annotations to develop and explain ideas.</p></div><div class="card learning"><h4>Test and refine</h4><p>Compare options against criteria, improve technical accuracy and evaluate impact on people and planet.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose an object, place or design problem and identify purpose, user, scale and relevant graphical methods.','Create a labelled sketch, construction, drawing, model or presentation using the unit vocabulary.','Evaluate clarity, accuracy, visual impact, user needs and one exact improvement.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===4?[['Scale connects drawing and reality','A scale ratio communicates how drawing dimensions relate to real dimensions.'],['Dimension for clarity','Use appropriate lines, arrows and numerical values so a maker or reader can understand size.'],['Useful habit','Measure twice, draw once, then check that dimensions do not duplicate or contradict each other.']]:i===6?[['Views must agree','Features should align consistently between plan, elevation and end elevation.'],['Projection lines are thinking tools','They transfer location and size, even if they remain light in a finished drawing.'],['Useful habit','Visualise the object first, then test each view against what can actually be seen from that direction.']]:i===11?[['Perspective represents apparent depth','Parallel lines receding away from the viewer appear to converge at a vanishing point.'],['The horizon represents eye level','Raising or lowering it changes how viewers experience the scene.'],['Useful habit','Keep verticals vertical and direct every relevant receding edge toward the correct vanishing point.']]:i===22?[['CBA 1 is Communicating through sketching','Students investigate and communicate ideas through freehand sketching, observation, visual inquiry and development.'],['Evidence is more than one final sketch','Show exploration through viewpoints, detail, annotations, alternatives and reflection.'],['Useful habit','Draw what you actually observe before redesigning it; visual evidence supports stronger decisions.']]:i===23?[['CBA 2 is Graphical presentation skills','Students research, develop and present a graphical response to a chosen or assigned brief.'],['Presentation must serve communication','Select methods, layout, annotations and media that help a specific audience understand the response.'],['Useful habit','Check technical accuracy and visual clarity together—one does not replace the other.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===22||i===23)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on visualisation, precision, design communication and real-world applications</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Observe or investigate</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Draw or develop</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Visual thinking habit:</b> define the purpose, observe and research, choose an appropriate graphical method, construct accurately, communicate clearly, then test the work against the brief and improve it.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle Graphics connection</h4><p style="margin:0">This unit connects 2D Graphics, 3D Graphics and Applied Graphics through visualisation, drawing, modelling, design thinking and communication.</p><div class="tags"><span class="tag">2D graphics</span><span class="tag">3D graphics</span><span class="tag">Applied graphics</span></div><ul><li>Use sketching, technical drawing and visualisation to communicate ideas and information.</li><li>Apply appropriate conventions, tools, scale, accuracy and spatial reasoning.</li><li>Research, develop and evaluate solutions for users, society and sustainable futures.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a sketch page, construction, drawing, orthographic projection, section, perspective, development, CAD model, research page, brief response, annotation or evaluation. Add: “The graphical method I can use more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Identify one place this method is used.</li><li>Complete a short accurate drawing.</li><li>Name one check before finalising work.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();</script></body></html>
