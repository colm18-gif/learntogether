(--light);font-size:.72rem}.main{min-width:0;flex:1;padding:38px 56px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:28px}.crumb{font:600 1.1rem Georgia,serif;color:var(--deep)}.progress{display:flex;align-items:center;gap:13px}.mosaic{display:grid;grid-template-columns:repeat(5,14px);gap:3px}.cell{height:14px;border:1px solid var(--line);border-radius:3px;background:#e3d9bc}.cell.on{background:linear-gradient(135deg,var(--accent) 0 45%,var(--ochre) 50%);border-color:var(--deep)}.count{font:12px monospace;color:var(--soft)}.count b{color:var(--deep)}.hero{background:var(--deep);border-radius:20px;padding:40px;color:#efe6d4;margin-bottom:34px}.eyebrow{font:12px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);margin-bottom:11px}.hero h2{margin:0;color:#f8f2e4;font-size:1.95rem;max-width:760px}.hero p{max-width:760px;color:#d8ccb3;margin:14px 0 0}.note{margin-top:21px;max-width:730px;padding:15px 17px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff0d;font-size:.9rem}.note b{color:var(--ochre)}.title{display:flex;align-items:center;gap:10px;font:1.17rem Georgia,serif;color:var(--deep);margin:32px 0 14px}.title:after{content:"";height:1px;flex:1;background:var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}.start{cursor:pointer}.start:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2b241814}.start .u{font:12px monospace;color:var(--clay)}.start h3{font-size:1rem;margin:4px 0}.strand{font-size:.82rem;color:var(--accent);font-style:italic}.unit-head{margin-bottom:25px}.unit-head h2{font-size:1.9rem;margin:5px 0}.intro{max-width:780px;color:var(--soft)}.flip{height:128px;perspective:900px;cursor:pointer}.flipin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}.flip. ound:#6f506e0f}.opt.correct{border-color:var(--good);background:#3e7a4f19}.opt.incorrect{border-color:var(--bad);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--deep);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.score{font:12px monospace;color:var(--deep)}.done{margin-top:28px;padding:15px 17px;border:1px solid var(--ochre);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--soft)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.sidefoot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Engineering, In Action</h1><p>A shared Junior Cycle Engineering path</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="sidefoot">26 units across Processes and Principles, Design Application and Mechatronics, with engineering knowledge, innovation, manufacturing and communication throughout.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="progress"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>

['Engineering and the Designed World','Engineering Knowledge','Explore how engineering applies science, maths, technology and creativity to solve practical problems responsibly.','Engineering|Using science, mathematics and creativity to design solutions.','System|Interconnected parts working together for a purpose.','Constraint|Limit such as cost, time, safety or materials.','Specification|Measurable requirements for a solution.','Stakeholder|Person or group affected by an engineering decision.','Sustainability|Meeting present needs without harming future capacity.'],
['Workshop Safety and Risk Management','Developing and Manufacturing','Apply safe workshop practice, risk assessment, machine awareness and responsible behaviour in practical engineering work.','Hazard|Anything with potential to cause harm.','Risk|Likelihood and severity of harm.','Risk assessment|Process of identifying hazards and controls.','PPE|Personal protective equipment.','Safe operating procedure|Agreed safe steps for equipment use.','Emergency stop|Control used to halt machinery quickly.'],

later project brief and development plan.']};const QUIZ=[['A specification is',['A set of measurable requirements','A final manufactured product','A workshop rule only','A type of metal'],0],['A moment is',['The turning effect of a force','A type of plastic','A circuit symbol','A safety sign'],0],['A sensor is used to',['Detect a change in conditions','Cut material','Store energy only','Draw a component'],0],['A closed-loop system uses',['Feedback to adjust output','No inputs','Only a battery','Only a user'],0],['Responsible engineering considers',['Safety, users, society and environment','Cost only','Appearance only','Speed only'],0]];const CBAQUIZ=[['CBA 1 Engineering in Action investigates',['An application of engineering in the world','Only an examination question','A fictional story','A final project alone'],0],['CBA 2 Research and Development helps inform',['The project assessment','Only a quiz','A sports team','No later work'],0],['A learning log should contain',['Evidence of activity, thinking and reflection','Only a title','No research','Another person’s work'],0],['Evaluation should include',['Effectiveness, limitations and impacts','Praise only','A list of tools','No evidence'],0],['A project brief should be',['Focused on a real opportunity or need','A finished conclusion','A random collection of images','Unrelated to research'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Engineering through principles, design, manufacture and mechatronics.</h2><p>This 26-unit pathway develops the three connected strands of Processes and Principles, Design Application and Mechatronics. It integrates engineering knowledge and awareness, innovation and exploration, developing and manufacturing, and communicating, with structured support for both CBAs and project development.</p><div class="note"><b>How to use this:</b> learn the concepts, discuss the engineering habit, complete a task and take the quiz. Save sketches, calculations, research, models, test results, photographs, learning logs and reflections in an Engineering portfolio.<br><br><b>Safety first:</b> practical work must follow teacher instruction, school procedures, equipment-specific guidance and risk assessments. This pathway complements supervised engineering learning; it does not replace workshop safety training.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The engineer’s toolkit</div><div class="grid"><div class="card learning"><h4>Understand principles</h4><p>Use forces, materials, energy, systems and data to explain why engineering solutions work.</p></div><div class="card learning"><h4>Design and make</h4><p>Research a real need, generate ideas, plan accurately, manufacture safely and control quality.</p></div><div class="card learning"><h4>Innovate responsibly</h4><p>Test ideas, evaluate trade-offs and account for people, safety, resources and the environment.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a real engineered product, structure or system and identify the need, constraints and principles involved.','Create a labelled sketch, diagram, calculation, model or test plan using the unit vocabulary accurately.','Evaluate a design decision for safety, performance, cost, users and environmental impact.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===5?[['Power describes rate','Power = work ÷ time, so a system completing the same work faster has greater power.'],['Efficiency is never usually 100%','Some energy is transferred to less useful forms such as heat or sound.'],['Useful habit','State units and distinguish energy from power in explanations.']]:i===6?[['Gears can change speed and direction','The gear ratio depends on the relative number of teeth or size of the gears.'],['Mechanisms transform motion','For example, a cam can turn rotary motion into a repeated linear movement.'],['Useful habit','Use arrows to show input motion, output motion and force direction.']]:i===15?[['Series and parallel behave differently','A parallel arrangement allows components to operate independently on branches.'],['Measure safely','Use only teacher-approved apparatus and check connections before power is applied.'],['Useful habit','Draw circuit diagrams with standard symbols rather than pictures of components.']]:i===23?[['CBA 1: Engineering in Action','Students investigate authentic applications of engineering and communicate individual findings through appropriate media.'],['Four areas are documented','Research and analysis, engineering principles, evaluation, and communication of the CBA.'],['A strong response makes the science visible','Do not merely describe the product; explain the engineering principles that make it work.']]:i===24?[['CBA 2: Research and Development','Students research, explore concepts and communicate findings that inform the project assessment.'],['Three areas are documented','Research and analysis, exploring concepts, and communicating the CBA.'],['Research should lead to development','Show how evidence changes, narrows or improves the proposed project direction.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===23||i===24)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on engineering knowledge, innovation, manufacture and communication</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Design or calculate</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Engineering habit:</b> define the need, use relevant principles and evidence, communicate clearly, manufacture or model safely, test systematically and evaluate impacts before improving.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle Engineering connection</h4><p style="margin:0">This unit connects Processes and Principles, Design Application and Mechatronics through engineering knowledge and awareness, innovation and exploration, developing and manufacturing, and communicating.</p><div class="tags"><span class="tag">Principles and systems</span><span class="tag">Design and manufacture</span><span class="tag">Mechatronics and communication</span></div><ul><li>Investigate and explain a real engineering application using appropriate technical language.</li><li>Develop, test and communicate ideas with sketches, calculations, models, data and digital tools.</li><li>Evaluate performance, safety, sustainability, users and limitations using evidence.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save research, annotated sketches, calculations, technical drawings, material tests, circuit diagrams, program logic, prototypes, test data, learning-log entries or evaluation. Add: “The engineering principle I can apply more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Draw or describe one relevant system, force, process or circuit.</li><li>Identify one safety or quality-control step.</li><li>Suggest and justify one improvement.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check
