['Word Classes','Writing','Identify the job each word does so that sentence construction, punctuation and style become more controlled.','Noun|A word naming a person, place, thing or idea.','Verb|A word expressing an action or state.','Adjective|A word describing a noun.','Adverb|A word describing a verb, adjective or another adverb.','Pronoun|A word used in place of a noun.','Preposition|A word showing relationship, often of place or time.'],

upported.'],21:['Compare two speakers or texts with different registers.','Rewrite the same message for two audiences.','Explain how language can include, exclude, empower or control.'],22:['Research one topic using two credible sources.','Record source details while working, not at the end.','Write a short synthesis and acknowledge every borrowed idea.'],23:['Choose a topic, audience, purpose and format for an oral task.','Plan an opening, three main points, visual support and conclusion.','Rehearse, record, evaluate and improve the delivery.'],24:['Save four varied texts produced across time.','Annotate each with audience, purpose, genre, strengths and changes made.','Write a reflection explaining development and next targets.'],25:['Select one finished piece and read it as an assessor.','Identify one strength, one weakness and three specific improvements.','Write a reflection that refers to feedback and evidence from the text.'],26:['Choose a text studied in class and create an enquiry question.','Connect reading evidence with a written or spoken response.','Compare a personal response with an alternative critical interpretation.']};

function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Work through Junior Cycle English, skill by skill and text by text.</h2><p>This 26-unit pathway develops the three interconnected strands of Oral Language, Reading and Writing. It moves from grammar and sentence control to literary analysis, poetry, drama, media literacy, creative writing, research and the two English Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn the terms, study the examples, complete the active task and then test your recall. Save drafts, recordings, annotations and reflections in an English portfolio.<br><br><b>Flexible by design:</b> schools choose their own novels, poems, films and media texts. The units focus on transferable techniques that can be applied to whatever is being studied.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The English toolkit</div><div class="grid"><div class="card learning"><h4>Read like a detective</h4><p>Notice a precise word, quote it, name the choice and explain its effect.</p></div><div class="card learning"><h4>Write for a reader</h4><p>Choose form, register, structure and detail according to audience and purpose.</p></div><div class="card learning"><h4>Draft, improve, reflect</h4><p>Keep versions of your work so that progress is visible, explainable and reusable.</p></div></div>'}
function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i+1]||['Choose a short text and identify five purposeful details.','Write a paragraph using two key terms and one precise example.','Compare two interpretations and justify the stronger one.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===0?[['Example: The nervous student opened the letter','Nervous is an adjective, student is a noun, opened is a verb, the is a determiner and letter is a noun.'],['Example: Because she practised, she improved','Because she practised is dependent; she improved is independent.'],['Useful habit','Ask what job each word or punctuation mark is doing in the sentence.']]:i===4?[['Do not stop at the label','“Metaphor” is identification. “The metaphor makes the character seem trapped” is analysis.'],['Use a quotation','Select a short, exact phrase and integrate it into your own sentence.'],['Explain effect','Discuss reader response, character, atmosphere, theme or emphasis.']]:i===22?[['Audience and purpose come first','A speech, podcast, presentation and interview need different choices.'],['Oral work is interactive','Listen, respond, ask questions and adapt rather than simply reading aloud.'],['Rehearsal improves communication','Practise timing, projection, pace, visuals and likely questions.']]:i===23?[['A collection should show range','Include different genres, purposes, audiences and forms.'],['Drafts are evidence of learning','Keep feedback and show how decisions improved the final texts.'],['Reflection needs evidence','Refer to exact choices or changes rather than saying only “I improved”.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=QUIZZES[i];let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on purposeful communication, close reading and controlled writing</div><p class="intro">'+u[2]+'</p></section><div class="title">Key terms · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Write or speak</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Analysis habit:</b> identify the writer’s choice, quote or describe the evidence, then explain its effect on meaning, character, audience, mood or tone.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle learning connection</h4><p style="margin:0">This unit integrates communicating as a listener, speaker, reader and writer with exploring language and understanding the context and structure of language.</p><div class="tags"><span class="tag">Oral Language</span><span class="tag">Reading</span><span class="tag">Writing</span></div><ul><li>Adapt language, structure and style for audience and purpose.</li><li>Read, analyse, compare and respond to a range of texts.</li><li>Create, redraft, present and reflect on purposeful texts.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save an annotated passage, paragraph, draft, recording, presentation plan, creative piece, debate response or reflection. Add: “What I can do more effectively now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three terms without looking.</li><li>Find one example in a text.</li><li>Explain one effect on a reader or listener.</li><li>Write one sentence using the skill accurately.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}
