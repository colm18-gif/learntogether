ems:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:28px}.crumb{font:600 1.1rem Georgia,serif;color:var(--d)}.prog{display:flex;align-items:center;gap:13px}.mosaic{display:grid;grid-template-columns:repeat(5,14px);gap:3px}.cell{height:14px;border:1px solid var(--ln);border-radius:3px;background:#e3d9bc}.cell.on{background:linear-gradient(135deg,var(--a) 0 45%,var(--g) 50%);border-color:var(--d)}.count{font:12px monospace;color:var(--s)}.count b{color:var(--d)}.hero{background:var(--d);border-radius:20px;padding:40px;color:#efe6d4;margin-bottom:34px}.ey{font:12px monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-bottom:11px}.hero h2{margin:0;color:#f8f2e4;font-size:1.95rem;max-width:760px}.hero p{max-width:760px;color:#d8ccb3;margin:14px 0 0}.note{margin-top:21px;max-width:730px;padding:15px 17px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff0d;font-size:.9rem}.note b{color:var(--g)}.title{display:flex;align-items:center;gap:10px;font:1.17rem Georgia,serif;color:var(--d);margin:32px 0 14px}.title:after{content:"";height:1px;flex:1;background:var(--ln)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--c);border:1px solid var(--ln);border-radius:var(--r);padding:16px 18px}.start{cursor:pointer}.start:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2b241814}.u{font:12px monospace;color:var(--cl)}.card h3{font-size:1rem;margin:4px 0}.strand{font-size:.82rem;color:var(--a);font-style:italic}.head{margin-bottom:25px}.head h2{font-size:1.9rem;margin:5px 0}.intro{max-width:780px;color:var(--s)}.flip{height:128px;perspective:900px;cursor:pointer}.in{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}.flip.flipped .in{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:13px;border-radius:var(--r);backface-visibility:hidden}.front{background:var(--c);border:1px solid var(--ln)}.front strong{font:600 1rem Georgia,serif;color:var(--d)}.front small{display:block;color:var(--s);margin-top:6px}.backface{background:var(--a);color:#fff;transform:rotateY(180deg);font-size:.86rem}.fact{display:flex;flex-wrap:wrap;gap:14px;background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:13px 16px;margin-bottom:8px}.fact b{min-width:275px;color:var(--d)}.fact span{flex:1;color:var(--s)}.learning h4{margin:0 0 7px;color:var(--d);font-size:1rem}.learning p{margin:0;color:var(--s);font-size:.9rem}.box{padding:16px 18px;border-radius:var(--r);margin:10px 0 18px}.study{background:#70488b0d;border-left:4px solid var(--a)}.align{background:#d9a4411a;border:1px solid var(--g)}.portfolio{background:#fff;border:1px solid var(--a)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.tag{background:var(--d);color:#f4eedf;border-radius:999px;padding:5px 9px;font:11px monospace}.tag:nth-child(2){background:var(--a)}.tag:nth-child(3){background:var(--cl)}.check{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.check li{background:#fff;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;font-size:.86rem}.check li:before{content:'✓';color:var(--ok);font-weight:bold;margin-right:7px}.quiz{background:var(--c);border:1px solid var(--ln);border-radius:var(--r);padding:22px 24px}.q{margin-bottom:21px}.prompt{font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--ln);border-radius:9px;padding:9px 12px;cursor:pointer}.opt.selected{border-color:var(--a);background:#70488b0f}.opt.correct{border-color:var(--ok);background:#3e7a4f19}.opt.incorrect{border-color:var(--no);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--d);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--ln);color:var(--i)}.score{font:12px monospace;color:var(--d)}.done{margin-top:28px;padding:15px 17px;border:1px solid var(--g);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--s)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.side{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.foot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="side"><div class="brand"><h1>Wood Technology</h1><p>A shared Junior Cycle pathway</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="foot">26 units across Principles and Practices, Design Thinking, and Wood Science and Materials, with workshop skills and CBA support.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="prog"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>const KEY='jc-wood-technology-v1';const RAW=[['Wood Technology and Responsible Making','Principles and Practices','Explore wood technology as a practical, creative and responsible way to investigate materials, solve problems and make useful artefacts.','Artefact|A made object designed for a purpose.','Workshop practice|Safe and effective ways of working in a workshop.','Design and make|Process of developing and producing a solution.','Material|Substance used to make an object.','Process|Method used to shape, join or finish material.','Evaluation|Judgement of work against stated criteria.'],['Workshop Safety and Risk Awareness','Principles and Practices','Develop responsible workshop habits by recognising hazards, following procedures, using PPE and responding appropriately to risk.','Hazard|Something with potential to cause harm.','Risk|Likelihood and seriousness of harm.','PPE|Personal protective equipment.','Safe system of work|Planned method that reduces risk.','Guard|Device protecting users from dangerous machine parts.','Housekeeping|Keeping a workspace clean, orderly and safe.'],['Measuring, Marking Out and Accuracy','Principles and Practices','Measure, mark, check and prepare timber accurately so components fit, function and finish well.','Marking out|Transferring dimensions and shapes onto material.','Tolerance|Allowed variation from a stated measurement.','Datum edge|Reference edge used for accurate marking.','Try square|Tool for checking and marking right angles.','Gauge|Tool for marking a line parallel to an edge.','Accuracy|Closeness to intended measurement or form.'],['Hand Tools: Cutting and Shaping','Principles and Practices','Select, use and care for hand tools appropriately when cutting, shaping, smoothing and preparing wood.','Saw|Hand tool used for cutting wood.','Chisel|Sharp tool for cutting or paring wood.','Plane|Tool for smoothing or shaping a wood surface.','Rasp|Coarse tool for shaping material.','Grain direction|Direction in which wood fibres run.','Tool maintenance|Cleaning, storing and keeping tools fit for use.'],['Machine Tools and Safe Operation','Principles and Practices','Understand the purpose, setup and safe operation of teacher-approved machine tools and fixed equipment.','Machine tool|Powered equipment used to cut, drill or shape material.','Set-up|Preparing equipment and material before use.','Feed direction|Direction material is moved through a machine.','Push stick|Device keeping hands away from cutting areas.','Emergency stop|Control used to stop a machine quickly.','Supervision|Guidance and oversight required for safe machine use.'],['Joining Wood: Joints and Fixings','Principles and Practices','Compare and make suitable joints and fixings based on strength, appearance, movement, tools and intended use.','Joint|Connection between two pieces of material.','Butt joint|Simple joint where ends or edges meet.','Mortise and tenon|Joint using a projecting tenon fitted into a mortise.','Dowel joint|Joint reinforced with wooden dowels.','Screw fixing|Mechanical fastening using a screw.','Adhesive|Substance used to bond surfaces.'],['Adhesives, Clamping and Assembly','Principles and Practices','Prepare surfaces, apply adhesives, clamp accurately and assemble components in a controlled sequence.','Clamping|Holding parts together under pressure.','Curing|Time during which adhesive develops strength.','Dry assembly|Trial fitting before adhesive is applied.','Alignment|Correct positioning of components.','Squeeze-out|Excess adhesive forced from a joint.','Assembly sequence|Planned order for joining components.'],['Finishing and Surface Preparation','Principles and Practices','Prepare and finish timber surfaces to improve protection, appearance, touch and durability.','Abrasive|Material used to smooth a surface.','Grain raising|Fibres standing up after moisture contacts wood.','Finish|Coating or treatment protecting or decorating a surface.','Varnish|Protective transparent or coloured coating.','Stain|Colouring treatment that penetrates timber.','Durability|Ability to withstand wear or use.'],['Timber as a Natural Resource','Wood Science and Materials','Investigate trees, forests, timber supply and the importance of using wood as a renewable resource responsibly.','Timber|Wood prepared for use.','Renewable resource|Resource that can regenerate when managed properly.','Forestry|Growing and managing forests.','Sustainable sourcing|Obtaining material with long-term environmental and social care.','Certification|Independent verification against stated standards.','Biodiversity|Variety of living organisms in an environment.'],['Tree Growth and Wood Structure','Wood Science and Materials','Understand basic tree growth, wood structure and how grain, growth rings and defects influence timber behaviour and appearance.','Growth ring|Layer of wood added during a period of growth.','Sapwood|Outer, younger wood carrying water in a living tree.','Heartwood|Inner, older wood often darker and more durable.','Grain|Direction and pattern of wood fibres.','Knot|Feature formed where a branch grew from a trunk.','Defect|Feature that may affect appearance or performance.'],['Hardwoods and Softwoods','Wood Science and Materials','Compare hardwoods and softwoods by origin, properties, appearance, workability, availability and appropriate uses.','Hardwood|Timber from broad-leaved flowering trees.','Softwood|Timber from cone-bearing trees.','Density|Mass per unit volume.','Workability|Ease with which timber can be cut and shaped.','Durability|Resistance to decay and wear.','Grain pattern|Visible arrangement of wood fibres.'],['Seasoning and Moisture Content','Wood Science and Materials','Explain why timber is dried and how moisture affects movement, strength, machining, joining and finishing.','Seasoning|Controlled drying of timber.','Moisture content|Amount of water held in wood.','Air drying|Drying timber naturally through air circulation.','Kiln drying|Drying timber in a controlled heated chamber.','Shrinkage|Reduction in size as wood dries.','Warping|Distortion caused by uneven movement or drying.'],['Wood Movement and Defects','Wood Science and Materials','Recognise how timber expands, contracts and may distort, then plan designs and construction methods that accommodate movement.','Expansion|Increase in size.','Contraction|Decrease in size.','Cupping|Warp where a board curves across its width.','Twisting|Warp where a board turns along its length.','Splitting|Separation along wood grain.','Allowance|Planned space or method accommodating movement.'],['Manufactured Boards','Wood Science and Materials','Compare plywood, MDF, chipboard, OSB and other manufactured boards for properties, uses, safety and environmental considerations.','Manufactured board|Board made by processing wood fibres, particles or veneers.','Plywood|Layered board made from veneers with alternating grain.','MDF|Board made from compressed wood fibres and resin.','Chipboard|Board made from wood particles and binder.','Veneer|Thin sheet of decorative wood.','Edge banding|Material used to cover exposed board edges.'],['Material Selection for Purpose','Wood Science and Materials','Select timber and boards by considering strength, stability, cost, appearance, availability, process, safety and lifecycle.','Specification|Detailed requirements a material or product must meet.','Strength|Ability to resist force without failure.','Stability|Ability to keep shape and resist movement.','Lifecycle|Stages from sourcing to disposal or reuse.','Costing|Calculation of material and production costs.','Fitness for purpose|Suitability for intended use.'],['Design Thinking and User Needs','Design Thinking','Define problems and opportunities through research, observation, empathy and clear understanding of user needs.','Design brief|Statement of a design problem or opportunity.','User|Person for whom a product is intended.','Empathy|Understanding another person’s needs and perspective.','User need|Requirement helping a person use or benefit from a design.','Constraint|Limit affecting possible solutions.','Success criteria|Standards used to judge whether a design works.'],['Research, Ideas and Innovation','Design Thinking','Gather relevant information, generate alternatives and develop creative ideas informed by evidence rather than assumption.','Primary research|Information gathered directly, such as observation or interview.','Secondary research|Information gathered from existing sources.','Mood board|Visual collection communicating a design direction.','Brainstorming|Generating many possible ideas.','Innovation|New or improved way of solving a problem.','Inspiration|Starting stimulus for creative work.'],['Sketching, Modelling and Communication','Design Thinking','Use sketches, annotations, mock-ups, models and drawings to develop and communicate ideas before making.','Sketch|Quick drawing used to explore an idea.','Annotation|Written note explaining a choice or feature.','Mock-up|Simple model used to test appearance or layout.','Prototype|Early model used to test function or construction.','Scale model|Smaller or larger representation using a fixed ratio.','Technical drawing|Accurate drawing communicating size and construction.'],['Planning and Managing a Project','Design Thinking','Plan resources, time, tools, materials, processes and quality checks so making is safe, achievable and controlled.','Time plan|Schedule for completing tasks.','Cutting list|List of material sizes needed for a project.','Bill of materials|List of materials, quantities and costs.','Workflow|Ordered sequence of making tasks.','Quality control|Checks ensuring work meets requirements.','Contingency|Alternative plan for a possible problem.'],['Sustainable Design and Circular Making','Design Thinking','Apply lifecycle thinking, efficient material use, repairability, reuse and responsible disposal to wood-based design.','Circular economy|Keeping materials in use for as long as possible.','Upcycling|Creating higher-value use from existing material.','Repairability|Ease with which an item can be repaired.','Material efficiency|Minimising waste while meeting needs.','Offcut|Usable leftover material from cutting.','End of life|What happens to a product after use.'],['Manufacture, Quality and Evaluation','Principles and Practices','Review processes and artefacts using evidence about function, quality, safety, appearance, sustainability and user response.','Quality|Degree to which an outcome meets requirements.','Function|What a product is intended to do.','Finish quality|Standard of a product’s surface appearance and protection.','Tolerance|Permitted variation in size or fit.','Feedback|Information used to improve work.','Evaluation|Judgement against evidence and criteria.'],['Wood Science in Our Environment: CBA 1','CBA 1 Planner','Investigate wood as a material and natural resource in the local or wider environment, communicating findings with evidence and reflection.','Wood science in our environment|CBA focused on investigating wood as a natural resource and material.','Investigation|Systematic inquiry into a question or topic.','Evidence|Information supporting a conclusion.','Environmental impact|Effect on natural systems and resources.','Sustainable forestry|Forest management balancing environmental, social and economic needs.','Communication|Clear sharing of research, ideas and findings.'],['Student Self-Analysis and Evaluation: CBA 2','CBA 2 Planner','Review a wood technology artefact and the making process using evidence, criteria, reflection and practical recommendations.','Self-analysis and evaluation|CBA focused on judging work and learning using evidence.','Artefact evaluation|Review of a made object against its purpose and criteria.','Criteria|Standards used to judge success.','Strength|Aspect of work that meets or exceeds expectations.','Limitation|Aspect needing improvement.','Recommendation|Specific practical proposal for improvement.'],['Design and Make Project Preparation','Integrated Practice','Integrate research, design, planning, workshop practice, wood science, making and evaluation in a manageable project.','Project brief|Statement guiding a design-and-make task.','Feasibility|Whether a solution can realistically be made.','Iteration|Cycle of testing and improvement.','Risk assessment|Review of hazards and controls before work begins.','Manufacturing plan|Detailed sequence for making an artefact.','Justification|Evidence-based explanation of a choice.'],['Repair, Reuse and Making for Community','Integrated Practice','Explore repair, reuse and small-scale wood projects that respond to real needs in home, school or community settings.','Repair|Restoring an item to useful condition.','Reuse|Using an item or material again.','Community need|Practical requirement shared by people in a group or place.','Maintenance|Routine care extending useful life.','Adaptation|Changing an item to suit a new use.','Stewardship|Responsible care of resources.'],['Review: From Tree to Artefact','Integrated Review','Connect wood science, material choice, design thinking, workshop skills, sustainability and critical evaluation in responsible making.','Value-added|Improved usefulness or worth created through making.','Responsible maker|Person who considers safety, users, resources and impact.','Material knowledge|Understanding of properties and behaviour of materials.','Craftsmanship|Skill and care in making.','Design decision|Choice made during development or manufacture.','Reflection|Thoughtful evaluation of learning and next steps.']];const GENERAL=[['Plan before cutting','Confirm the brief, dimensions, material, tools, safety controls, sequence and quality checks before beginning.'],['Work safely and deliberately','Follow teacher instructions, use correct PPE and equipment, maintain an orderly workspace and stop if unsure.'],['Evaluate using evidence','Judge both process and artefact against function, accuracy, construction, finish, user needs and sustainability.']];const SPECIAL={1:['Identify hazards in a teacher-approved workshop area and state the matching control measure.','Create a personal pre-work checklist: PPE, hair/clothing, equipment, workspace and instructions.','Explain why stopping to ask for help is a responsible safety action.'],2:['Measure and mark a simple component from a datum edge using teacher-approved tools.','Check key dimensions before cutting and record one tolerance or quality requirement.','Compare the final component with the drawing and identify one correction if needed.'],5:['Compare two joints for a particular product based on strength, appearance and available tools.','Practise a teacher-approved joint on scrap timber before using final material.','Explain how grain direction, adhesive and clamping affect joint quality.'],11:['Compare air drying and kiln drying using time, control and likely outcome.','Observe a sample or image of warped wood and name the distortion.','Explain one design or storage choice that can reduce problems caused by wood movement.'],13:['Compare plywood, MDF and chipboard for a specified indoor product.','Select a board and justify choice through strength, finish, edge treatment, tools, cost and sustainability.','Identify an appropriate safety consideration for dust, cutting or finishing.'],15:['Write a concise design brief for a useful wooden item and identify the intended user.','Gather one primary and one secondary source of research before sketching three ideas.','Turn research into three measurable success criteria.'],18:['Create a cutting list, basic time plan and ordered workflow for a small teacher-approved artefact.','Include materials, tools, safety controls and quality checks at each key stage.','Identify one realistic contingency if material, time or a process does not go to plan.'],21:['Choose a local or wider wood-related question, such as forest management, timber sourcing or wood use.','Gather credible evidence and present key findings through visuals, notes and accurate terminology.','Conclude with a supported statement about responsible use of wood in the environment.'],22:['Photograph or sketch an artefact at suitable stages and compare it to the original brief and criteria.','Identify one strength, one limitation and one piece of evidence for each.','Write a specific recommendation that could be actioned in a future version.'],23:['Analyse a project brief, research users and materials, then make an achievable plan.','Develop sketches or models, select a feasible solution and justify the decision.','Prepare to evaluate safety, process, quality, function and sustainability throughout.']};const QUIZ=[['A hazard is',['Something with potential to cause harm','A completed product','A type of timber only','A measuring tool'],0],['A datum edge is used as',['A reliable reference for marking out','A decorative edge','A substitute for a ruler','A type of finish'],0],['Seasoning timber means',['Drying it in a controlled way','Painting it immediately','Gluing it together','Burning waste wood'],0],['Plywood is made from',['Layers of veneer with alternating grain','Only sawdust','Solid plastic','One uncut tree trunk'],0],['A design brief should identify',['A problem or opportunity, user and constraints','Only a favourite colour','The finished answer already','No need for research'],0]];const CBAQUIZ=[['CBA 1 in Wood Technology is',['Wood science in our environment','A music performance','A final exam only','A freehand sketch task'],0],['CBA 2 focuses on',['Student self-analysis and evaluation','Only material buying','A food literacy brief','A written novel'],0],['A strong artefact evaluation uses',['Evidence and clear criteria','Only “I like it”','No reference to the brief','A list of tools only'],0],['Sustainable forestry involves',['Managing forests responsibly for the long term','Using all timber as quickly as possible','Ignoring biodiversity','Avoiding all wood use'],0],['A recommendation should be',['Specific and practical for a future improvement','A vague compliment','Unrelated to the work','A replacement for evidence'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="ey">A path for two, at one pace</div><h2>Explore Junior Cycle Wood Technology through materials, design thinking, skilled making and responsible choices.</h2><p>This 26-unit pathway develops the connected strands of Principles and Practices, Design Thinking, and Wood Science and Materials. It supports safe workshop learning, practical investigation, design-and-make work, sustainability and both Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn the concepts, discuss the making habit, complete a planning or investigation task and take the quiz. Save research, risk assessments, sketches, cutting lists, process notes, photographs, evaluations and reflections in a Wood Technology portfolio.<br><br><b>Safety first:</b> only use tools, machinery, adhesives, finishes and workshop equipment under teacher instruction and school procedures. This pathway supports learning but does not replace supervised practical instruction, risk assessment or manufacturer guidance.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The responsible maker’s toolkit</div><div class="grid"><div class="card learning"><h4>Understand material</h4><p>Investigate where wood comes from, how it behaves, how it is processed and how choices affect people and planet.</p></div><div class="card learning"><h4>Plan with purpose</h4><p>Use research, sketching, modelling, cutting lists, time plans and safe systems of work before making.</p></div><div class="card learning"><h4>Make, test and improve</h4><p>Build practical skills safely, check quality along the way and evaluate evidence from the finished artefact.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a wood-related object or problem and identify the user, function, materials, constraints and safety considerations.','Create a labelled sketch, investigation, comparison, plan or teacher-approved practical trial using the unit vocabulary.','Evaluate one choice for safety, function, quality, user needs, resources and sustainability.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="in"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===1?[['Safety is planned, not assumed','Safe work begins before a tool is picked up: assess the task, understand controls, prepare the space and follow instruction.'],['PPE is one layer of protection','Appropriate PPE complements—not replaces—training, guarding, correct setup and careful behaviour.'],['Useful habit','If you are uncertain, stop, make the area safe and ask the teacher before continuing.']]:i===5?[['Joint selection depends on purpose','A suitable joint balances strength, appearance, movement, available tools, time and intended use.'],['Dry assembly reduces surprises','Trial-fit components before adhesive to check alignment, squareness and sequence.'],['Useful habit','Protect surfaces from adhesive squeeze-out and use clamps only as instructed.']]:i===10?[['Hardwood and softwood describe tree type','They do not simply mean “hard” or “soft”; properties vary between individual species.'],['Selection needs evidence','Consider strength, grain, durability, workability, cost, supply and intended use.'],['Useful habit','Match a material property to an exact product requirement.']]:i===21?[['CBA 1 is Wood science in our environment','Students investigate wood as a natural resource and material, then communicate supported findings.'],['Evidence makes conclusions stronger','Use credible sources, careful observation and accurate terminology.'],['Useful habit','Distinguish a sourced fact from your own evidence-based interpretation.']]:i===22?[['CBA 2 is Student self-analysis and evaluation','Students evaluate an artefact and their learning using evidence, criteria, reflection and recommendations.'],['Specific evidence matters','Refer to measurements, photographs, test results, user feedback, joint quality or finish—not only opinions.'],['Useful habit','A useful recommendation says exactly what would change, why, and how it could improve the result.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===21||i===22)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="head"><div class="ey">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on material understanding, responsible making, design thinking and practical evaluation</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Investigate or plan</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Develop or make</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Responsible making habit:</b> understand the brief and material, plan tools and controls, work safely with teacher guidance, check quality during the process, then evaluate the artefact and identify a specific improvement.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle Wood Technology connection</h4><p style="margin:0">This unit connects Principles and Practices, Design Thinking, and Wood Science and Materials through investigation, planning, communication, creation, sustainability and evaluation.</p><div class="tags"><span class="tag">Principles and practices</span><span class="tag">Design thinking</span><span class="tag">Wood science and materials</span></div><ul><li>Plan and manage resources, tools, processes, safety and time in practical work.</li><li>Communicate and create ideas through research, sketching, modelling, making and reflection.</li><li>Investigate materials and environmental impact to make informed, sustainable choices.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a risk assessment, timber or board comparison, sketch, research note, cutting list, time plan, process photo, quality check, CBA evidence, artefact evaluation or reflection. Add: “The responsible-making decision I can make more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Identify one safety or quality control.</li><li>Link a material property to a product need.</li><li>Name one sustainable improvement.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();(function(){var m=location.hash.match(/^#u(\d+)$/);if(m&&RAW[+m[1]])go(+m[1]);else home()})();</script></body></html>
