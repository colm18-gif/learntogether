<script>
const S='jc-history-complete-v1';
const RAW=[
['The Work of the Historian','Nature of History','Use evidence, chronology, cause, consequence, empathy and interpretation to make justified claims about the past.','Primary source|Evidence created at the time of an event.','Secondary source|An account produced later using earlier evidence.','Bias|A viewpoint that favours one side or interpretation.','Chronology|The order in which events happened.','Cause and consequence|Why something happened and what resulted.','Historical empathy|Understanding people in their own context.'],
['Reading the Evidence','Nature of History','Learn how archaeology, oral history, documents, images and objects can each reveal part of the past.','Artefact|An object made or used by people in the past.','Archaeology|Study of the past through physical remains.','Oral history|Spoken memories and accounts of the past.','Eyewitness|A person who saw an event happen.','Reliability|How far a source can be trusted for a question.','Repository|A place where historical records are preserved.'],
['Ancient and Early Ireland','History of Ireland','Explore Stone Age monuments, Iron Age culture, early Christianity and the evidence they left behind.','Newgrange|A Stone Age passage tomb in County Meath, built around 3200 BC.','Ogham|An early Irish alphabet carved in lines and notches.','Celts|Iron Age communities associated with Celtic culture and language.','Monastery|A centre of religion, learning and craft.','St Patrick|A missionary traditionally linked to Christianity in Ireland.','Book of Kells|An illuminated manuscript associated with Irish monastic culture.'],
['Vikings and Normans in Ireland','History of Ireland','Investigate two waves of newcomers who reshaped towns, warfare, trade and political power in Ireland.','Vikings|Scandinavian raiders, traders and settlers.','Longphort|A Viking ship base or fortified settlement.','Dublin|A town that developed from a Viking settlement.','Normans|Invaders from England and Wales who arrived in 1169.','Strongbow|Richard de Clare, a Norman leader.','Motte and bailey|An early earth-and-timber castle.'],
['Plantations and Tudor Conquest','History of Ireland','Examine land, religion, power and settlement in sixteenth- and seventeenth-century Ireland.','Plantation|Settlement of colonists on confiscated land.','Tudor conquest|Campaign to bring Ireland under Crown control.','Flight of the Earls|The 1607 departure of Gaelic Irish leaders.','Ulster Plantation|A major plantation begun in 1609.','Penal Laws|Laws restricting many Catholic rights.','Confiscation|Taking land or property by authority.'],
['The Great Famine','History of Ireland','Study the human experience, evidence and lasting consequences of the famine of 1845–1849.','Great Famine|Mass starvation in Ireland from 1845 to 1849.','Potato blight|Plant disease that destroyed potato crops.','Emigration|Leaving a country to settle elsewhere.','Coffin ships|Poorly equipped emigrant ships with high death rates.','Workhouse|Institution offering food and shelter in exchange for labour.','Relief|Aid intended to reduce suffering.'],
['The Road to Independence','History of Ireland','Follow Home Rule, the 1916 Rising, War of Independence, Treaty, partition and Civil War.','Home Rule|An Irish parliament within the United Kingdom.','Easter Rising|Armed rebellion in Dublin in April 1916.','War of Independence|Guerrilla conflict, 1919–1921.','Anglo-Irish Treaty|1921 agreement creating the Free State.','Civil War|Conflict between pro- and anti-Treaty sides.','Partition|Division of the island into two jurisdictions.'],
['Ireland Since Independence','History of Ireland','Consider the Free State, neutrality, social change, the Troubles and the peace process.','Irish Free State|The 26-county state established in 1922.','The Emergency|Ireland’s term for neutrality during World War II.','Constitution of 1937|Constitution creating the state named Éire.','The Troubles|Conflict in Northern Ireland from the late 1960s to 1998.','Good Friday Agreement|The 1998 peace agreement.','Reconciliation|Work to address conflict and relationships after violence.'],
['The Irish Diaspora','History of Ireland','Explore why Irish people migrated, how they maintained connections and how migration shaped communities worldwide.','Diaspora|A population dispersed from an ancestral homeland.','Push factor|A condition encouraging people to leave.','Pull factor|A condition attracting people to a destination.','Remittance|Money sent home by migrants.','Chain migration|Migration supported by family or social networks.','Migration|Movement from one place to another.'],
['Women in Twentieth-Century Ireland','History of Ireland','Investigate changing rights, work, education, law and activism while recognising diverse lived experiences.','Suffrage|The right to vote.','Citizenship|Membership of a state with rights and responsibilities.','Employment bar|Rule requiring many women to leave public-service work on marriage.','Second-wave feminism|Movement for gender equality in work, law and society.','Activism|Organised action for social or political change.','Legislation|Laws made by parliament.'],
['Ancient Civilisations','Europe and the Wider World','Compare Egypt, Greece and Rome through government, belief, society, technology and surviving evidence.','Pharaoh|An ancient Egyptian ruler.','Hieroglyphics|The writing system of ancient Egypt.','Democracy|Government involving citizen participation.','Polis|A Greek city-state.','Roman Republic|Period when Rome was governed without an emperor.','Empire|A state controlling other territories and peoples.'],
['Medieval Life and Society','Europe and the Wider World','Study status, religion, work, towns, disease and unequal experience in medieval Europe.','Feudal system|A hierarchy of landholding and obligations.','Manor|A lord’s estate and local economic unit.','Serf|A peasant tied to land and obligations.','Guild|Association of craftspeople or merchants.','Black Death|Plague pandemic in fourteenth-century Europe.','Pilgrimage|Journey to a sacred place.'],
['Renaissance and Reformation','Europe and the Wider World','Explore new approaches to art, learning, science, printing and religion in early modern Europe.','Renaissance|Renewed interest in classical art and learning.','Humanism|Emphasis on human potential and classical learning.','Printing press|Technology that spread texts and ideas quickly.','Reformation|Movement leading to Protestant churches.','Martin Luther|German monk associated with the 1517 challenge to Church practice.','Patron|A person or institution funding artists or projects.'],
['Exploration, Conquest and Colonisation','Europe and the Wider World','Examine trade, power, conquest, colonisation and their consequences for Indigenous peoples.','Exploration|Travel to investigate places and routes.','Colonisation|Outside control and settlement of territory.','Empire|A state controlling other territories and peoples.','Indigenous peoples|Peoples with longstanding connection to a place.','Transatlantic slave trade|Forced transportation and enslavement of Africans.','Mercantilism|Ideas linking national power with trade and colonial wealth.'],
['Age of Revolutions','Europe and the Wider World','Investigate the American and French Revolutions and debates about rights, citizenship and power.','American Revolution|War in which colonies gained independence from Britain.','Declaration of Independence|1776 document declaring the colonies independent.','French Revolution|Political change in France beginning in 1789.','Bastille|Paris fortress-prison stormed in 1789.','Guillotine|Execution device used during the Revolution.','Republic|A state without a hereditary monarch.'],
['Industrial Revolution','Europe and the Wider World','Explore factories, steam, urbanisation and the unequal social consequences of industrial change.','Industrial Revolution|Shift from hand production to machine production.','Factory|Building for mass production using machinery.','Steam engine|Engine using steam power to perform work.','Urbanisation|Growth of towns and cities.','Child labour|Employment of children, often in harmful conditions.','Reform|Change intended to improve a system.'],
['World War I','Europe and the Wider World','Explain causes, warfare, human experience and consequences of the 1914–1918 conflict.','Alliance system|Agreements between states that widened conflict.','Assassination of Franz Ferdinand|June 1914 event that helped trigger war.','Trench warfare|Fighting from defensive ditches.','Allied Powers|Coalition including Britain, France and Russia.','Central Powers|Coalition including Germany and Austria-Hungary.','Armistice|Agreement stopping fighting in 1918.'],
['World War II and the Holocaust','Europe and the Wider World','Study dictatorship, war, genocide, resistance and commemoration carefully and accurately.','Nazi Germany|Dictatorship led by Adolf Hitler.','Holocaust|Genocide of six million Jews and millions of other targeted people.','Axis Powers|Germany, Italy, Japan and allies.','Allies|Coalition including Britain, Soviet Union and USA.','D-Day|Allied Normandy landings, 6 June 1944.','Genocide|Deliberate destruction of a protected group.'],
['The 1960s: Ireland and the Wider World','Ireland and Wider World','Assess political, cultural and social change through civil rights, television, decolonisation, protest and youth culture.','Civil rights|Rights to equal treatment and participation.','Decolonisation|End of colonial rule and creation of independent states.','Youth culture|Cultural styles associated with young people.','Mass media|Communication reaching large audiences.','Consumer society|Society strongly shaped by buying goods.','Protest movement|Organised public action for change.'],
['The Cold War','Europe and the Wider World','Explain rivalry between the USA and Soviet Union and its global political, cultural and technological effects.','Cold War|Post-war rivalry between USA and Soviet Union.','Superpower|State with exceptional global influence.','NATO|Western military alliance.','Warsaw Pact|Eastern military alliance led by USSR.','Nuclear deterrence|Prevention through fear of retaliation.','Proxy war|Conflict where powers support opposing sides.'],
['Technology and Historical Change','Europe and the Wider World','Consider how inventions transform daily life and why effects vary by access, cost, power and culture.','Innovation|A new idea or technology put into use.','Infrastructure|Basic systems such as roads and networks.','Mechanisation|Using machines to support or replace labour.','Digital revolution|Change linked to computers and digital communication.','Unintended consequence|An unplanned outcome.','Access divide|Unequal access to technology or skills.'],
['International Co-operation: UN and EU','Europe and the Wider World','Evaluate how international organisations seek peace, co-operation, rights and shared solutions.','United Nations|Organisation founded in 1945 for peace and co-operation.','European Union|Political and economic union of European states.','Human rights|Basic rights and freedoms.','Peacekeeping|Efforts to maintain or restore peace.','Sovereignty|A state’s authority to govern itself.','International law|Rules governing relations between states.'],
['Patterns of Change in Everyday Life','Europe and the Wider World','Trace change and continuity in work, leisure, food, health, fashion or communication.','Continuity|What stays broadly the same over time.','Change|What becomes different over time.','Turning point|A moment of significant shift.','Periodisation|Dividing history into named periods.','Trend|A general direction of change.','Historical significance|Importance argued using criteria and evidence.'],
['Local and Family History','Nature of History','Research a place, building, school, club, object or family story using evidence and careful source handling.','Local history|History of a particular place.','Family history|Research into ancestors and family stories.','Census|Official count and record of a population.','Genealogy|Study of family lines and ancestry.','Heritage|Traditions, buildings and culture inherited from the past.','Archive|A preserved collection of records.'],
['CBA 1: The Past in My Place','CBA Project Planner','Plan an evidence-based enquiry into a local, place or family-history topic. Choose a manageable question, gather different sources, compare them and make a supported conclusion.','Enquiry question|A focused question guiding research.','Bibliography|A list of sources used.','Caption|Brief explanation accompanying an image or object.','Corroboration|Checking one source against another.','Interpretation|An explanation of evidence.','Reflection|Thinking about what was learned and how.'],
['CBA 2: A Life in Time','CBA Project Planner','Research a person in historical context. Go beyond biography by explaining the person’s significance, choices, challenges and legacy using varied evidence.','Historical context|The circumstances of a time and place.','Significance|Importance based on impact, scale, legacy or symbolism.','Legacy|What remains or is remembered afterwards.','Biography|Account of a person’s life.','Perspective|A particular viewpoint.','Citation|Information showing where evidence came from.']
];
const SPECIAL={
1:['Choose one source and ask: who created it, when, why, for whom and what is missing?','Write a 120-word judgement using “useful because” and “limited because”.','Explain why two historians may interpret the same source differently.'],
6:['Use a map, letter, memorial or register to investigate the Famine.','Explain why dependence on one crop increased vulnerability.','Compare the experiences of a tenant, landlord, relief worker and emigrant.'],
17:['Analyse a recruitment poster for purpose, audience and bias.','Explain how alliances, militarism, nationalism and the assassination interacted.','Compare the experience of a soldier, nurse and civilian.'],
18:['Use an individual testimony or memorial to preserve human scale and dignity.','Create a careful timeline of persecution, deportation, genocide and liberation.','Explain why propaganda must not be treated as neutral evidence.'],
25:['Choose a manageable local question and gather three different source types.','Complete a source record for every item: creator, date, location, usefulness and limitation.','Present a supported conclusion in a report, display, podcast, web page or presentation.'],
26:['Create a timeline linking the person’s life with wider events.','Use at least three types of evidence and record full source details.','Judge significance using impact, scale, duration, symbolism or legacy.']};
const FACTS=[
['A primary source can still be biased','Contemporary evidence needs careful evaluation, not automatic trust.'],['Triangulate your evidence','Compare different sources before making a conclusion.'],['Context matters','Ask what was happening at the time and whose voice may be absent.']];
const QUIZ=[['A source created at the time of an event is usually a',['Primary source','Secondary source','Timeline','Interpretation'],0],['A reliable historical conclusion should be based on',['Evidence and reasoning','A guess','One unchecked opinion','The longest source'],0],['Bias is best understood as',['A viewpoint that may favour one side','A date','A type of monument','A neutral fact'],0],['Chronology means',['Putting events in order','Choosing the most famous person','Writing a bibliography','Drawing a map'],0],['A strong historical judgement should include',['A claim, evidence and qualification','Dates only','Opinion only','No conclusion'],0]];
let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(S)||'{}')}catch(e){}
function save(){localStorage.setItem(S,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);window.scrollTo({top:0,behavior:'instant'})}
function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Uncover Junior Cycle History together, one enquiry at a time.</h2><p>This 26-unit pathway develops the skills of the historian alongside a wide survey of Irish, European and wider-world history. Every unit combines vocabulary, knowledge, source-aware tasks, writing practice and self-check quizzes.</p><div class="note"><b>How to use this:</b> learn the terms, discuss the key facts, complete the active tasks and then test recall. Keep one piece of work from each unit in a History portfolio.<br><br><b>Flexible by design:</b> schools select their own personalities, issues and events, so jump to the unit that matches classroom learning.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The historian’s toolkit</div><div class="grid"><div class="card learning"><h4>Interrogate sources</h4><p>Ask who, when, why, for whom, what is shown and what is missing.</p></div><div class="card learning"><h4>Build the big picture</h4><p>Keep timelines and connect local, Irish, European and global events.</p></div><div class="card learning"><h4>Make supported judgements</h4><p>Use evidence, explain limitations and include a considered “however”.</p></div></div>'}
function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i+1]||['Choose a relevant source, map, image or artefact and identify five details.','Write a paragraph using two key terms and one piece of evidence.','Compare two perspectives and reach a justified conclusion.'],st=state[i]||{a:{},checked:false};state[i]=st;document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');let flips=terms.map((t,n)=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===5?[['The Famine began in 1845','Potato blight devastated a staple crop and created a humanitarian catastrophe.'],['Population fell dramatically','Death and emigration reshaped Irish society for generations.'],['Interpretations require evidence','Policy, power, class and lived experience need to be examined together.']]:i===17?[['World War II began in Europe in 1939','Germany’s invasion of Poland led to declarations of war.'],['The Holocaust was a genocide','Its victims must be studied with accuracy, dignity and attention to individual experience.'],['D-Day took place on 6 June 1944','The Normandy landings opened a major western front.']]:i===25?[['Start with a focused question','A clear question prevents a project becoming a list of facts.'],['Use varied evidence','Combine material such as photographs, maps, interviews, records or objects.'],['Keep full source records','Record creator, date, location, usefulness and limitation as you research.']]:i===26?[['Life in Time is more than biography','Set the person’s choices and experiences in historical context.'],['Use varied evidence','Compare personal testimony with contemporary and later sources.'],['Make a judgement on significance','Use impact, scale, duration, symbolism or legacy as criteria.']]:FACTS).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===25||i===26)?[['The best first step in a history project is',['Choose a focused enquiry question','Copy a website','Write the conclusion','Pick images only'],0],['A bibliography is',['A list of sources used','A timeline','A map','A quiz'],0],['Corroboration means',['Checking evidence against other sources','Ignoring other sources','Memorising dates','Choosing one favourite source'],0],['A strong conclusion should',['Answer the enquiry question using evidence','Repeat the introduction','Add no judgement','Only list sources'],0],['A limitation is',['What a source cannot tell us well','A fact in the source','The title of a source','A correct answer'],0]]:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on evidence, interpretation and historical judgement</div><p class="intro">'+u[2]+'</p></section><div class="title">Key terms · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Key facts and examples</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Write</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Source habit:</b> before trusting a source, identify its creator, date, purpose, audience, useful details, limits and the perspective that may be missing.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle learning connection</h4><p style="margin:0">This unit combines historical knowledge with chronological awareness, source evaluation, historical empathy, perspective and evidence-based judgement.</p><div class="tags"><span class="tag">Nature of History</span><span class="tag">Working with evidence</span><span class="tag">Thinking historically</span></div><ul><li>Identify and explain key details from a historical source.</li><li>Compare accounts and consider context, purpose and bias.</li><li>Communicate a supported conclusion in spoken, written or visual form.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save one timeline, source analysis, map, paragraph, interview note, debate response, display panel or corrected quiz. Add: “What I can explain now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Name three key terms without looking.</li><li>Put three events or developments in order.</li><li>Explain one cause and one consequence.</li><li>Make one judgement using “because” and “however”.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}
function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();
</script></body></html>
