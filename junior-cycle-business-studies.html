kground:#275b780f}.opt.correct{border-color:var(--good);background:#3e7a4f19}.opt.incorrect{border-color:var(--bad);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--deep);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.score{font:12px monospace;color:var(--deep)}.done{margin-top:28px;padding:15px 17px;border:1px dashed var(--ochre);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--soft)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.sidefoot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Business, In Practice</h1><p>A shared Junior Cycle Business Studies path</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="sidefoot">26 units across Personal Finance, Enterprise and Our Economy, with practical business skills, research, ethical decision-making and CBA planning.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="progress"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>
const KEY='jc-business-complete-v1';const RAW=[
['Needs, Wants and Resources','Personal Finance','Make informed choices about limited resources, needs, wants, opportunity cost and responsible consumption.','Need|Something essential for health, safety or basic wellbeing.','Want|Something desirable but not essential.','Resource|Anything useful for meeting needs or wants.','Scarcity|Limited resources compared with unlimited wants.','Opportunity cost|The next best alternative given up when making a choice.','Consumer|A person who buys or uses goods and services.'],
['Income, Expenditure and Budgets','Personal Finance','Identify income and expenditure, construct a realistic budget and decide how to improve a financial position.','Income|Money received.','Expenditure|Money spent.','Budget|Plan for expected income and spending.','Fixed cost|Cost that tends to stay the same each period.','Variable cost|Cost that can change each period.','Disposable income|Income available after necessary deductions.'],
['Saving and Borrowing','Personal Finance','Compare saving and borrowing options by purpose, cost, benefit, risk and suitability.','Saving|Setting money aside for a future purpose.','Borrowing|Receiving money now that must be repaid.','Interest|Cost of borrowing or return on saving.','Loan|Money borrowed and repaid under agreed terms.','Credit union|Member-owned financial co-operative.','Repayment|Money paid back towards a debt.'],
['Personal Taxes and Charges','Personal Finance','Recognise common taxes, charges and public services and explain when financial obligations arise.','Tax|Money collected by government to fund public services.','Income tax|Tax on income.','VAT|Value-added tax included in many prices.','PRSI|Social insurance contribution in Ireland.','Charge|Amount paid for a service or facility.','Revenue|State body responsible for tax administration.'],
['Insurance and Risk','Personal Finance','Identify risks and compare insurance products in terms of cost, cover, excess and exclusions.','Insurance|Protection against specified financial loss.','Premium|Regular cost of insurance.','Policy|The insurance contract.','Excess|Amount paid by the policyholder before the insurer pays.','Risk|Possibility of loss or harm.','Exclusion|Situation not covered by an insurance policy.'],
['Consumer Rights and Responsibilities','Personal Finance','Understand consumer rights, responsibilities, redress and the role of reliable information before purchasing.','Consumer right|Protection or entitlement when buying goods or services.','Consumer responsibility|Duty to act honestly, carefully and safely.','Redress|Solution when something goes wrong, such as repair or refund.','Guarantee|Promise about quality or repair.','Receipt|Proof of purchase.','Misleading advertising|Promotion that creates a false impression.'],
['Financial Institutions and Digital Money','Personal Finance','Compare banks, credit unions, payment methods and digital-finance choices using safety and suitability criteria.','Current account|Account for everyday payments.','Debit card|Card spending money directly from an account.','Direct debit|Automatic regular payment from an account.','Online banking|Managing money through internet services.','Scam|Dishonest attempt to obtain money or information.','Authentication|Process used to confirm identity.'],
['The Financial Life Cycle','Personal Finance','Consider changing financial needs at different life stages and plan responsibly for short-, medium- and long-term goals.','Financial life cycle|Changing financial needs across life stages.','Short-term goal|Goal achievable soon, often within a year.','Medium-term goal|Goal requiring planning over several years.','Long-term goal|Goal requiring planning over many years.','Pension|Income arrangement for retirement.','Emergency fund|Savings held for unexpected costs.'],
['Types of Enterprise','Enterprise','Identify financial, social, cultural and community enterprise and evaluate the role each can play in society.','Enterprise|Activity that identifies and acts on an opportunity.','Entrepreneur|Person who develops and takes responsibility for an enterprise.','Social enterprise|Organisation trading to achieve a social purpose.','Sole trader|Business owned by one person.','Partnership|Business owned by two or more people.','Limited company|Business structure with separate legal identity.'],

['Enterprising Skills and Entrepreneurship','Enterprise','Develop creativity, initiative, resilience, teamwork and calculated risk-taking for enterprise and wider life.','Initiative|Ability to start useful action independently.','Creativity|Ability to produce valuable new ideas.','Resilience|Ability to recover and persist after setbacks.','Calculated risk|Risk assessed before action is taken.','Leadership|Guiding and supporting others towards a goal.','Innovation|New or improved idea, product, service or process.'],
['Market Research','Enterprise','Research an opportunity, gather evidence, analyse findings and make a justified recommendation.','Market research|Collecting information about customers or a market.','Primary research|Information collected first-hand.','Secondary research|Information already collected by others.','Questionnaire|Set of questions used to gather responses.','Sample|Part of a target group surveyed.','Target market|Specific group a business aims to serve.'],
['Marketing Mix','Enterprise','Use product, price, place and promotion to create a coherent marketing plan for a product or service.','Product|Good or service offered to customers.','Price|Amount charged for a product or service.','Place|How and where a product reaches customers.','Promotion|Communication used to inform and persuade customers.','Brand|Name, design or identity distinguishing an offering.','Unique selling point|Feature making an offering stand out.'],

['International Trade and Globalisation','Our Economy','Explore imports, exports, comparative advantage, global supply chains and the opportunities and risks of interdependence.','Import|Good or service bought from another country.','Export|Good or service sold to another country.','Trade|Buying and selling between people, firms or countries.','Globalisation|Growing international connections in trade, culture and production.','Tariff|Tax placed on imports.','Supply chain|Steps and organisations involved in making and delivering a product.'],
['Sustainable Business and the Circular Economy','Enterprise and Our Economy','Evaluate environmental and social impacts of business choices and develop practical sustainable alternatives.','Circular economy|System keeping materials in use for as long as possible.','Carbon footprint|Greenhouse-gas emissions linked to an activity.','Renewable resource|Resource that can naturally replenish.','Greenwashing|Misleading environmental claims.','Lifecycle|Stages from production to use and disposal.','Sustainable procurement|Buying goods or services with social and environmental criteria.'],
['Business in Action: CBA 1','CBA Planner','Plan a group Business in Action project through research, analysis, evaluation, presentation and reflection.','Research question|Focused question guiding investigation.','Evidence|Information supporting analysis.','Analysis|Breaking information into meaningful parts.','Evaluation|Judging value using evidence and criteria.','Digital presentation|Technology-supported communication of findings.','Reflection|Thoughtful evaluation of learning and contribution.'],
['Business Decision-Making: CBA 2','CBA Planner','Prepare an individual decision-making project using business concepts, evidence, options, recommendation and reflection.','Decision-making|Choosing between options using evidence.','Criteria|Standards used to compare choices.','Recommendation|Suggested action supported by reasoning.','Cost-benefit analysis|Comparison of likely advantages and disadvantages.','Risk assessment|Identifying and evaluating possible risks.','Justification|Reasoned explanation for a decision.']
];
const GENERAL=[['Start with a real question','Identify who is affected, what information is needed and what decision or judgement must be made.'],['Use evidence, not instinct alone','Collect data, compare options, check credibility and explain why evidence supports your view.'],['Think ethically','Consider customers, workers, community and environmental effects, not only financial gain.']];

let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Learn Junior Cycle Business Studies through real decisions and practical action.</h2><p>This 26-unit pathway develops Personal Finance, Enterprise and Our Economy together. It combines everyday money choices, consumer awareness, research, marketing, documents, economic concepts, ethical business and planning for both Classroom-Based Assessments.</p><div class="note"><b>How to use this:</b> learn the terms, discuss the worked habits, complete the active task and take the quiz. Save budgets, research, business documents, presentations and reflections in a Business portfolio.<br><br><b>Flexible by design:</b> teachers choose examples and sequence learning outcomes across the three years. Use the unit that fits current classroom learning.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+Strin n Action is collaborative','The project involves conducting research, analysing and evaluating findings, then communicating them digitally.'],['Use all three strands where relevant','Personal Finance, Enterprise and Our Economy can inform the chosen task.'],['Reflection is evidence','Explain what you contributed, learned and would do differently.']]:i===25?[['Decision-making needs alternatives','A strong project compares realistic options rather than defending a predetermined answer.'],['Criteria make judgement visible','Use cost, benefit, risk, suitability, ethics and sustainability as appropriate.'],['Recommendation is not certainty','Acknowledge limitations and explain what further information could change the decision.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===24||i===25)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on informed, ethical and evidence-based decisions</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div
