d .flipin{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:13px;border-radius:var(--radius);backface-visibility:hidden}.front{background:var(--card);border:1px solid var(--line)}.front strong{font:600 1rem Georgia,serif;color:var(--deep)}.front small{display:block;color:var(--soft);margin-top:6px}.backface{background:var(--accent);color:#fff;transform:rotateY(180deg);font-size:.86rem}.fact{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px}.fact b{min-width:275px;color:var(--deep)}.fact span{flex:1;color:var(--soft)}.learning h4{margin:0 0 7px;color:var(--deep);font-size:1rem}.learning p{margin:0;color:var(--soft);font-size:.9rem}.box{padding:16px 18px;border-radius:var(--radius);margin:10px 0 18px}.study{background:#9a3f630d;border-left:4px solid var(--accent)}.align{background:#d9a4411a;border:1px solid var(--ochre)}.portfolio{background:#fff;border:1px solid var(--accent)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.tag{background:var(--deep);color:#f4eedf;border-radius:999px;padding:5px 9px;font:11px monospace}.tag:nth-child(2){background:var(--accent)}.tag:nth-child(3){background:var(--clay)}.check{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.check li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.86rem}.check li:before{content:'✓';color:var(--good);font-weight:bold;margin-right:7px}.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}.q{margin-bottom:21px}.prompt{font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.opt.selected{border-color:var(--accent);background:# const KEY='jc-home-economics-complete-v1';const RAW=[
['Healthy and Sustainable Living','Food, Health and Culinary Skills','Explore the connections between food, health, family life, textiles, resources and sustainable everyday choices.','Wellbeing|State of physical, mental and social health.','Sustainability|Meeting present needs without harming future capacity.','Lifestyle|Patterns of everyday living that affect health and resources.','Consumer|Person who buys or uses goods and services.','Resource|Something useful for meeting needs.','Responsibility|Duty to make informed and ethical choices.'],
['Food Safety and Hygiene','Food, Health and Culinary Skills','Apply safe food-handling, personal hygiene, storage, cooking and cleaning practices in practical food work.','Food hygiene|Practices keeping food safe to eat.','Cross-contamination|Transfer of harmful microorganisms between foods or surfaces.','Bacteria|Microscopic organisms; some can cause food poisoning.','Temperature danger zone|Range in which bacteria multiply quickly.','Best-before date|Date about quality rather than safety.','Use-by date|Date linked to food safety.'],

['Meal Planning and Food Literacy','Food, Health and Culinary Skills','Plan meals that are nutritious, affordable, safe, practical and suited to people’s needs and circumstances.','Food literacy|Knowledge and skills for making informed food choices.','Meal plan|Planned selection of meals over a period.','Portion|Amount of food served or eaten.','Budget|Plan for income and spending.','Seasonal food|Food naturally available at a particular time of year.','Dietary requirement|Food need related to health, belief or lifestyle.'],
['Practical Food Skills','Food, Health and Culinary Skills','Develop safe, efficient and confident culinary techniques, from weighing and measuring to preparation, cooking and presentation.','Mise en place|Preparing ingredients and equipment before cooking.','Weighing and measuring|Accurately determining ingredient quantities.','Knife skills|Safe and controlled cutting techniques.','Cooking method|Way heat is applied to food.','Time plan|Schedule for completing practical work.','Presentation|Appearance and serving of prepared food.'],
['Food Provenance and Sustainability','Food, Health and Culinary Skills','Investigate where food comes from and consider production, transport, packaging, waste, fairness and environmental impact.','Food provenance|Where food comes from and how it is produced.','Food miles|Distance food travels from production to consumer.','Seasonality|Availability of food at different times of year.','Packaging|Material used to contain and protect food.','Food waste|Edible food discarded or left unused.','Ethical consumption|Buying choices considering people, animals and environment.'],
['Food Labels and Consumer Information','Food, Health and Culinary Skills','Read labels to compare nutrition, ingredients, allergens, storage, dates, origin and marketing claims.','Ingredients list|Items used to make a food, usually listed by weight.','Nutrition label|Information about energy and nutrients.','Allergen information|Details of ingredients that may trigger allergy.','Serving size|Amount used as the basis for label information.','Claim|Statement made about a food or product.','Marketing|Communication intended to influence consumers.'],

];const GENERAL=[['Plan before acting','Clarify needs, users, resources, time, cost, safety and sustainability before making a practical decision.'],['Use reliable information','Compare labels, sources, claims, instructions and evidence before reaching a conclusion.'],['Reflect and improve','Evaluate outcomes against clear criteria, then identify a practical and specific next step.']];const SPECIAL={1:['Identify a food-safety hazard and state a control measure.','Create a fridge or cupboard storage plan using safe food-handling principles.','Explain why visible cleanliness alone does not guarantee food safety.'],4:['Plan one affordable, balanced meal suitable for a specified person or household.','Include nutrition, budget, time, equipment, seasonality and food-waste considerations.','Explain how a different dietary requirement would change the plan.'],5:['Create a time plan and equipment list before beginning a teacher-approved practical task.','Use safe measuring, preparation and cooking techniques under supervision.','Evaluate timing, presentation, nutrition, cost and one improvement.'],13:['Collect fabric samples or images and compare properties with likely uses.','Choose a fabric for a real item and justify choice using at least three properties.','Evaluate lifecycle, care and sustainability as well as appearance.'],17:['Develop two textile concepts from a brief using sketches, samples and annotations.','Practise one stitch, seam, appliqué or decorative technique safely.','Test and improve the design for function, quality, user needs and sustainability.'],21:['Analyse a food-literacy skills brief and list the user needs, constraints and success criteria.','Research suitable recipes and draft a proposed solution with nutrition, cost, ingredients and time plan.','Justify the final choice using three factors, then identify a possible improvement.'],22:['Respond to the selected Creative Textiles option by researching and developing a clear brief.','Create annotated ideas, choose materials and techniques, then make or upcycle safely.','Evaluate the finished textile item against design principles, sustainability and the brief.'],23:['Read the practical brief carefully and create an achievable workflow plan.','Prepare food only using teacher-approved methods, equipment and hygiene procedures.','Evaluate result through sensory assessment, timing, nutrition, presentation and cost.']};const QUIZ=[['A balanced diet provides',['Suitable variety and amounts of nutrients','Only protein','No carbohydrates','The same food every day'],0],['Cross-contamination is',['Transfer of harmful microorganisms between food or surfaces','Cooking food thoroughly','Reading a label','Planning a budget'],0],['A consumer receipt is useful because it',['Provides proof of purchase','Makes a product healthier','Guarantees a refund in every case','Replaces a budget'],0],['A design brief is',['A statement of a problem or opportunity','A finished textile item','A type of fibre','A cooking method'],0],['A sustainable choice considers',['Environmental, social and economic impacts','Price only','Appearance only','Speed only'],0]];const CBAQUIZ=[['Creative Textiles CBA uses',['The design brief process and principles of design and sustainability','Only a written exam','No practical work','A food recipe only'],0],['The Food Literacy Skills Brief requires',['Researching, analysing and planning a proposed food solution','Only cooking without planning','A textile sample only','No nutrition knowledge'],0],['A time plan helps to',['Organise practical tasks safely and efficiently','Avoid preparation','Increase food waste','Replace hygiene rules'],0],['Evaluation should include',['Evidence, strengths, limitations and improvements','Praise only','A title only','No reference to the brief'],0],['A proposed solution should be',['Justified using factors such as nutrition, cost, time and suitability','Chosen at random','Unrelated to the brief','Left unexplained'],0]];let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Home Economics through food, family life, textiles and sustainable everyday choices.</h2><p>This 26-unit pathway develops practical knowledge and skills through Food, Health and Culinary Skills; Responsible Family Living; and Textiles and Craft. It includes planning support for Creative Textiles, the Food Literacy Skills Brief and the practical food skills examination.</p><div class="note"><b>How to use this:</b> learn the concepts, discuss the everyday-life habit, complete a task and take the quiz. Save meal plans, recipes, textile ideas, samples, budgets, research, evaluations and reflections in a Home Economics portfolio.<br><br><b>Safety first:</b> food and textile practical work must follow teacher instruction, school safety procedures, food-hygiene guidance and equipment-specific rules. This pathway supports learning but does not replace supervised practical instruction.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The home economist’s toolkit</div><div class="grid"><div class="card learning"><h4>Plan for real life</h4><p>Balance needs, resources, cost, safety, time, health, users and sustainability before acting.</p></div><div class="card learning"><h4>Build practical confidence</h4><p>Develop culinary and textile skills safely through preparation, practice, feedback and evaluation.</p></div><div class="card learning"><h4>Make informed choices</h4><p>Question information, compare options and consider consequences for people, home and planet.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose an everyday decision related to food, family living or textiles and identify the needs, resources and constraints.','Create a labelled plan, comparison, sketch, recipe idea, budget or care guide using the unit vocabulary.','Evaluate one option for health, cost, safety, users, ethics and environmental impact.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===2?[['Macronutrients and micronutrients','Carbohydrate, protein and fat are macronutrients; vitamins and minerals are micronutrients.'],['Balance matters more than perfection','A healthy eating pattern is based on variety, suitability and regular informed choices.'],['Useful habit','Use reliable guidance and consider the person, not a one-size-fits-all rule.']]:i===5?[['Mise en place supports safe, calm cooking','Prepare ingredients, equipment and workspace before heat is switched on.'],['A time plan prevents clashes','Schedule preparation, cooking, washing up and presentation so equipment is available when needed.'],['Useful habit','Clean as you go and follow teacher-approved food safety procedures.']]:i===17?[['Design starts with a brief','A clear brief identifies intended user, purpose, constraints and desired qualities.'],['Samples support decisions','Test stitches, seams, colours and materials before committing to the final item.'],['Useful habit','Annotate design choices to explain function, materials, techniques and sustainability.']]:i===21?[['CBA 2 links to the practical food skills examination','Students research, analyse and plan a proposed response to the selected food literacy skills brief.'],['A proposed solution is planned, not just named','It should include research, possible solutions, an outline of the preferred solution and reasons for the choice.'],['Consider three factors','For example: nutritional value, cost, time, skills, equipment, suitability, sustainability or dietary needs.']]:i===22?[['CBA 1 is Creative Textiles','Students apply the design brief process, design principles and sustainability to make, recycle or upcycle a textile item.'],['The process is evidence','Research, idea development, material selection, techniques, making, testing and evaluation all matter.'],['Make reflection specific','Refer to exact choices, feedback, technical challenges and changes rather than only saying “it went well”.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===21||i===22)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on healthy, informed, practical and sustainable everyday living</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Plan or make</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Home Economics habit:</b> identify needs, use reliable information, plan safely, manage resources, consider people and planet, then evaluate the outcome and improve it.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle Home Economics connection</h4><p style="margin:0">This unit connects Food, Health and Culinary Skills; Responsible Family Living; and Textiles and Craft to develop informed, healthy, sustainable and practical living.</p><div class="tags"><span class="tag">Food and health</span><span class="tag">Family and resources</span><span class="tag">Textiles and sustainability</span></div><ul><li>Use relevant knowledge, practical skills and reliable information in everyday contexts.</li><li>Plan, prepare, design or manage resources safely and efficiently.</li><li>Evaluate choices in terms of health, wellbeing, cost, quality, people and environment.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a meal plan, nutritional comparison, recipe, time plan, budget, consumer research, fabric sample, textile sketch, design brief, test, evaluation or reflection. Add: “The everyday-life skill I can apply more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Give one real-world example.</li><li>Identify one safety or quality step.</li><li>Suggest one sustainable improvement.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();</script></body></html>
