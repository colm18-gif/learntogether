const RAW=[
['Directed Numbers and Order of Operations','Number','Work confidently with positive and negative numbers and apply brackets, powers, multiplication, division, addition and subtraction in the correct order.','Directed number|A number with a positive or negative sign showing direction.','Order of operations|Brackets, powers, multiplication/division, addition/subtraction.','Adding a negative|The same as subtracting a positive number.','Subtracting a negative|The same as adding a positive number.','Multiplying signs|Same signs give positive; different signs give negative.','Inverse operation|An operation that undoes another operation.'],
['Fractions, Decimals and Percentages','Number','Move fluently between equivalent representations and use percentages in money, discounts, increases, decreases and comparisons.','Equivalent fractions|Fractions representing the same value.','Fraction to decimal|Divide numerator by denominator.','Decimal to percentage|Multiply by 100 and add the percentage sign.','Percentage of an amount|Multiply by the percentage written as a decimal.','Percentage increase|Multiply by 1 plus the percentage decimal.','Percentage decrease|Multiply by 1 minus the percentage decimal.'],
['Ratio, Proportion and Rates','Number','Compare quantities fairly, share amounts in a ratio and reason about direct proportion, unit price, recipes, maps and pay.','Ratio|Comparison of two or more quantities.','Simplifying a ratio|Divide all parts by their highest common factor.','Direct proportion|Quantities change at the same constant rate.','Sharing in a ratio|Split a total according to ratio parts.','Unit rate|Amount per one unit.','Scale factor|Number by which a measurement is multiplied.'],
['Indices and Standard Form','Number','Use powers and index laws and write very large or small numbers in compact standard form.','Index|Shows how many times a base is multiplied by itself.','Product rule|For the same base, add indices when multiplying.','Quotient rule|For the same base, subtract indices when dividing.','Zero index|Any non-zero number to power zero equals one.','Standard form|A×10ⁿ where 1≤A<10.','Negative index|Represents a reciprocal power.'],
['Rounding, Estimation and Significant Figures','Number','Round sensibly, estimate before calculating and use significant figures to communicate an appropriate level of accuracy.','Decimal places|Digits after the decimal point.','Significant figures|Digits counted from the first non-zero digit.','Estimation|An approximate answer found by rounding.','Truncation|Cutting off digits without rounding.','Error interval|Range of values that could round to a stated value.','Reasonableness|Whether an answer makes sense in context.'],
['Expressions and Substitution','Algebra and Functions','Read, simplify and evaluate algebraic expressions and substitute numbers for variables.','Term|A number, variable or product of numbers and variables.','Like terms|Terms with the same variable part.','Expression|Terms combined without an equals sign.','Substitution|Replacing a variable with a given value.','Expanding brackets|Multiplying every term inside by the outside term.','Factor|A number or expression multiplied by another.'],
['Solving Equations and Inequalities','Algebra and Functions','Use inverse operations and balance to solve equations and represent simple inequalities.','Equation|Statement that two expressions are equal.','Inverse operation|Operation that undoes another.','Balancing|Doing the same operation to both sides.','Two-step equation|Equation requiring two inverse operations.','Inequality|Relationship using <, >, ≤ or ≥.','Solution|A value that makes an equation true.'],
['Sequences, Patterns and Generalisation','Algebra and Functions','Recognise patterns, describe common differences and use nth-term rules to find terms without listing them all.','Sequence|An ordered list following a rule.','Common difference|Constant amount added or subtracted.','Nth term|Formula giving any term from its position.','Linear sequence|Sequence with a constant difference.','Conjecture|A mathematical statement suggested by examples.','Generalisation|A rule applying beyond the original examples.'],
['Graphs and Functions','Algebra and Functions','Represent relationships in tables, graphs and rules and interpret what a graph says in context.','Coordinate|An ordered pair locating a point.','Function|Rule assigning an output to an input.','Input|Value put into a rule.','Output|Value produced by a rule.','Gradient|Rate of change of a straight-line graph.','Intercept|Point where a graph crosses an axis.'],
['Angles, Triangles and Polygons','Geometry and Trigonometry','Use angle facts on lines, around points, in triangles and polygons, including isosceles and exterior-angle reasoning.','Straight-line angles|Angles adding to 180°.','Angles around a point|Angles adding to 360°.','Triangle angles|Interior angles adding to 180°.','Isosceles triangle|Triangle with two equal sides and base angles.','Exterior angle|Equal to the sum of two opposite interior angles.','Polygon|A closed shape with straight sides.'],
['Area, Perimeter, Surface Area and Volume','Geometry and Trigonometry','Apply formulas for rectangles, triangles, circles, prisms and cuboids and include correct units.','Perimeter|Distance around a 2D shape.','Area|Size of a surface measured in square units.','Volume|Space occupied by a 3D object.','Circumference|Distance around a circle.','Prism|Solid with constant cross-section.','Scale drawing|Drawing using a fixed scale factor.'],
['Coordinate Geometry','Geometry and Trigonometry','Plot, read and describe points, lines and midpoints on the coordinate plane.','Coordinates|An ordered x,y pair.','x-axis|Horizontal axis.','y-axis|Vertical axis.','Origin|Point (0,0).','Midpoint|Point halfway between two endpoints.','Quadrant|One of the four regions of the coordinate plane.'],

['Probability and Chance','Statistics and Probability','Represent chance from impossible to certain and calculate probabilities from equally likely outcomes and experiments.','Probability|Chance of an event from 0 to 1.','Sample space|All possible outcomes.','Event|Outcome or group of outcomes of interest.','Relative frequency|Observed proportion in repeated trials.','Independent events|Events where one outcome does not affect another.','Expected value|Long-run average outcome suggested by probability.'],
['Displaying and Interpreting Data','Statistics and Probability','Choose and interpret bar charts, pie charts, line graphs, frequency tables and misleading displays.','Bar chart|Bars comparing separate categories.','Pie chart|Circle sectors showing parts of a whole.','Line graph|Connected points showing change, often over time.','Frequency|How often a value occurs.','Frequency table|Values or categories alongside frequencies.','Axis scale|Numbering used to measure a graph axis.'],
['Problem-Solving Strategies','Unifying Strand','Build a flexible toolkit for unfamiliar problems: understand, represent, plan, try, check, explain and improve.','Problem-solving cycle|Understand, plan, do, check, communicate and reflect.','Representation|Diagram, table, graph, equation or model of a situation.','Strategy|Chosen method for approaching a problem.','Trial and improvement|Test a value, learn from it and refine.','Constraint|Condition limiting possible solutions.','Optimal solution|Best solution according to stated criteria.'],

['Investigation: Patterns and Proof','Unifying Strand','Generate examples, make conjectures, test them and present convincing arguments or counterexamples.','Conjecture|Statement believed true from evidence but not yet proved.','Proof|A logical argument demonstrating truth.','Counterexample|Single example disproving a universal claim.','Inductive reasoning|Reasoning from examples towards a pattern.','Deductive reasoning|Reasoning from accepted facts to a conclusion.','Invariant|A property that remains unchanged.'],
['Mathematical Investigation CBA 1','CBA Planner','Plan a mathematical investigation over time using the problem-solving cycle and communicate a report in an appropriate format.','Research question|Focused question guiding an investigation.','Data collection|Gathering relevant measurements or information.','Variable|Quantity that can change in an investigation.','Method|Planned procedure for solving or investigating.','Findings|Results supported by evidence.','Reflection|Evaluation of process, choices and learning.'],
['Statistical Investigation CBA 2','CBA Planner','Plan a statistical enquiry using a question, data, analysis, interpretation and evaluation.','Statistical question|Question expecting variable answers from data.','Population|Whole group being studied.','Sample|Part of a population selected for study.','Bias|Systematic influence distorting data or conclusions.','Correlation|Association between variables, not necessarily causation.','Inference|Conclusion drawn from sample evidence.'],
['Financial Mathematics','Number and Algebra','Apply percentages, rates, tables and algebra to saving, spending, tax, discounts, bills and interest.','Budget|Plan for income and expenditure.','Discount|Reduction from an original price.','Profit|Revenue minus cost.','Simple interest|Interest calculated on original principal.','Compound interest|Interest calculated on principal plus previous interest.','VAT|Tax added to the price of goods or services.'],
['Measurement, Scale and Accuracy','Number and Geometry','Use units, conversions, scales, estimates and appropriate accuracy in practical contexts.','Unit conversion|Changing a measurement to an equivalent unit.','Scale|Relationship between drawing and reality.','Precision|Degree of detail in a measurement.','Accuracy|Closeness to the true value.','Tolerance|Permitted range of variation.','Metric system|Measurement system based on powers of ten.'],
['Review, Mixed Practice and Transfer','All strands','Bring number, algebra, geometry, statistics, probability, problem solving and communication together in unfamiliar contexts.','Transfer|Using knowledge in a new context.','Multi-step problem|Problem requiring connected stages.','Reasonableness check|Test of whether a result makes sense.','Efficiency|Solving accurately with an economical method.','Alternative method|Different valid route to a result.','Reflection|Explanation of what worked and what to improve.']
];

const QUIZ=[['The Junior Cycle Mathematics unifying strand includes',['Problem solving and communication','Only arithmetic','Only geometry','Only statistics'],0],['A good solution should include',['Working and an interpreted conclusion','An answer only','A calculator display only','No units'],0],['An estimate is useful because it',['Checks whether an exact answer is sensible','Is always exact','Replaces every calculation','Removes the need for reasoning'],0],['A conjecture is',['A statement suggested by examples','A unit conversion','A graph axis','A final answer only'],0],['A mathematical model is',['A representation of a real situation','A random guess','A calculator','A type of angle'],0]];
const CBAQUIZ=[['A mathematical investigation should begin with',['A focused question and plan','A final answer','A bibliography only','A graph with no question'],0],['A statistical question expects',['Variable answers from data','One fixed answer always','No data','Only an opinion'],0],['A sample is',['Part of a population','The whole universe','A graph title','A calculation error'],0],['Correlation shows',['Association, not automatically causation','Proof of causation','No relationship ever','A probability of one'],0],['A strong report should discuss',['Method, findings and limitations','Only the final number','Only the title','No evidence'],0]];

function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Work through Junior Cycle Mathematics, concept by concept and problem by problem.</h2><p>This 26-unit pathway covers Number, Algebra and Functions, Geometry and Trigonometry, Statistics and Probability, plus the unifying elements of building blocks, representation, connections, problem solving, generalisation, proof and communication.</p><div class="note"><b>How to use this:</b> learn the concept, study the worked habit, attempt the active task and then complete the quiz. Keep calculations, corrections and investigations in a Maths portfolio.<br><br><b>Flexible by design:</b> schools sequence topics differently and offer Ordinary or Higher Level pathways. Use the unit that matches current classroom learning and ask the teacher or textbook for the exact level and method expected.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The mathematical toolkit</div><div class="grid"><div class="card learning"><h4>Represent it</h4><p>Use a diagram, table, graph, equation, formula, number line or model.</p></div><div class="card learning"><h4>Reason about it</h4><p>Estimate, identify constraints, test a method and check the result in context.</p></div><div class="card learning"><h4>Communicate it</h4><p>Show clear working, use correct notation and explain why your answer is valid.</p></div></div>'}
function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a practical or unfamiliar problem and represent it in two ways.','Show a complete solution with a clear method, calculation and conclusion.','Find an alternative method, counterexample or improvement and justify it.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===0?[['Example: 8 − 3 × 2','Multiply first: 3×2=6, then 8−6=2.'],['Example: subtracting a negative','5−(−3)=5+3=8.'],['Useful habit','Write one stage per line and check signs before using a calculator.']]:i===1?[['Percentage of an amount','20% of 50 = 0.20×50 = 10.'],['Percentage increase','Increase 80 by 25%: 80×1.25=100.'],['Useful habit','Convert between fraction, decimal and percentage to check equivalence.']]:i===12?[['Pythagoras','A 3–4–5 triangle gives 3²+4²=5².'],['SOHCAHTOA','Choose the ratio from the sides and angle actually known.'],['Useful habit','Label the right angle and hypotenuse before calculating.']]:i===22?[['CBA 1: Mathematical investigation','Follow the problem-solving cycle over the investigation period and communicate a report.'],['Possible evidence','Question, representations, calculations, revisions, findings and reflection.'],['Key judgement','Explain why the method and conclusion are reasonable, including limitations.']]:i===23?[['CBA 2: Statistical investigation','Follow the statistical enquiry cycle: question, data, analysis, interpretation and evaluation.'],['Possible evidence','Question, sampling method, table or graph, summaries, interpretation and reflection.'],['Key judgement','Do not claim causation from correlation and acknowledge sample limitations.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===22||i===23)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on understanding, representation, reasoning and communication</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Calculate or explain</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Mathematical habit:</b> estimate first, represent the situation, show each stage, check the answer and interpret it using the original units or context.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle learning connection</h4><p style="margin:0">This unit integrates the unifying strand: building blocks, representation, connections, problem solving, generalisation and proof, and communication.</p><div class="tags"><span class="tag">Building blocks</span><span class="tag">Problem solving</span><span class="tag">Communication</span></div><ul><li>Represent mathematical situations in more than one form.</li><li>Choose, apply and evaluate a suitable procedure or strategy.</li><li>Explain reasoning and interpret the result in context.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save one worked problem, corrected error, graph, proof attempt, investigation page or reflection. Add: “The strategy I can use more confidently now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Write the relevant rule or formula.</li><li>Estimate the answer before calculating.</li><li>Explain why the result is reasonable.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}
function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();(function(){var m=location.hash.match(/^#u(\d+)$/);if(m&&RAW[+m[1]])go(+m[1]);else home()})();
</script></body></html>
